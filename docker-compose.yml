services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '${HOME}/rag-data:/var/www/rag-data'
        networks:
            - sail
        depends_on:
            - mysql
            - pgsql
    mysql:
        image: 'mysql/mysql-server:8.0'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    pgsql:
        image: 'pgvector/pgvector:pg17'
        ports:
            - '${FORWARD_PG_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${KB_DB_PASSWORD:-password}'
            POSTGRES_DB: '${KB_DB_DATABASE:-knowledge_base}'
            POSTGRES_USER: '${KB_DB_USERNAME:-sail}'
            POSTGRES_PASSWORD: '${KB_DB_PASSWORD:-password}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${KB_DB_DATABASE:-knowledge_base}'
                - '-U'
                - '${KB_DB_USERNAME:-sail}'
            retries: 3
            timeout: 5s
    pm-agent:
        build:
            context: ../pm-agent
            dockerfile: Dockerfile
        image: partner-manager-3-pm-agent
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - ./docker/agent/config.yaml:/etc/pm-agent/config.yaml:ro
            - agent-status:/var/lib/pm-agent/status
        networks:
            sail:
            pm-shared:
                aliases:
                    - pm-agent
        depends_on:
            - laravel.test
networks:
    sail:
        driver: bridge
    pm-shared:
        external: true
volumes:
    sail-mysql:
        driver: local
    sail-pgsql:
        driver: local
    agent-status:
        driver: local
