<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="700" rx="16" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3436">Secrets Boundary Map</text>
  <text x="550" y="56" text-anchor="middle" font-size="11" fill="#636e72">What stays where &#8212; secrets never cross their designated trust boundary</text>

  <!-- ============================================================ -->
  <!-- CLIENT BOUNDARY (top, large) -->
  <!-- ============================================================ -->
  <rect x="30" y="72" width="1040" height="370" rx="14" fill="none" stroke="#0984e3" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#shadow)"/>
  <rect x="30" y="72" width="1040" height="34" rx="14" fill="#0984e3"/>
  <rect x="30" y="98" width="1040" height="8" fill="#0984e3"/>
  <text x="550" y="95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">CLIENT BOUNDARY</text>

  <!-- App Container (left) -->
  <rect x="50" y="118" width="490" height="310" rx="10" fill="#fff" stroke="#dfe6e9" stroke-width="1" filter="url(#shadow)"/>
  <rect x="50" y="118" width="490" height="32" rx="10" fill="#0984e3"/>
  <rect x="50" y="142" width="490" height="8" fill="#0984e3"/>
  <text x="295" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">App Container (Laravel)</text>

  <!-- App secrets list -->
  <text x="70" y="172" font-size="11" font-weight="600" fill="#2d3436">Application Secrets</text>

  <text x="70" y="194" font-size="10" fill="#2d3436">DB_PASSWORD</text>
  <text x="280" y="194" font-size="9" font-weight="600" fill="#d63031">&#10007; Cannot cross to agent</text>

  <text x="70" y="214" font-size="10" fill="#2d3436">APP_KEY</text>
  <text x="280" y="214" font-size="9" font-weight="600" fill="#d63031">&#10007; Cannot cross to agent</text>

  <text x="70" y="234" font-size="10" fill="#2d3436">MAIL_PASSWORD</text>
  <text x="280" y="234" font-size="9" font-weight="600" fill="#d63031">&#10007; Cannot cross to agent</text>

  <text x="70" y="254" font-size="10" fill="#2d3436">API Tokens (3rd-party)</text>
  <text x="280" y="254" font-size="9" font-weight="600" fill="#d63031">&#10007; Cannot cross to agent</text>

  <text x="70" y="274" font-size="10" fill="#2d3436">SESSION_SECRET</text>
  <text x="280" y="274" font-size="9" font-weight="600" fill="#d63031">&#10007; Cannot cross to agent</text>

  <!-- Client Database sub-box -->
  <rect x="70" y="294" width="450" height="56" rx="8" fill="#f8f9fa" stroke="#dfe6e9" stroke-width="1"/>
  <text x="90" y="314" font-size="10" font-weight="600" fill="#2d3436">Client Database</text>
  <text x="90" y="332" font-size="9" fill="#636e72">Passwords: bcrypt &#8226; Tokens: SHA-256 &#8226; Sensitive fields: AES-256-CBC via APP_KEY</text>

  <!-- App container isolation note -->
  <rect x="70" y="362" width="450" height="52" rx="6" fill="#fef2f2" stroke="#d63031" stroke-width="1"/>
  <text x="90" y="382" font-size="9" font-weight="600" fill="#d63031">ISOLATION GUARANTEE</text>
  <text x="90" y="398" font-size="9" fill="#636e72">Agent container has NO access to .env, database, or any application secret.</text>
  <text x="90" y="412" font-size="9" fill="#636e72">Separate Docker network. No shared volumes for secrets.</text>

  <!-- Agent Container (right) -->
  <rect x="560" y="118" width="490" height="310" rx="10" fill="#fff" stroke="#dfe6e9" stroke-width="1" filter="url(#shadow)"/>
  <rect x="560" y="118" width="490" height="32" rx="10" fill="#e17055"/>
  <rect x="560" y="142" width="490" height="8" fill="#e17055"/>
  <text x="805" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Agent Container (Go Sidecar)</text>

  <!-- Agent secrets list -->
  <text x="580" y="172" font-size="11" font-weight="600" fill="#2d3436">Agent Credentials</text>

  <rect x="580" y="182" width="450" height="50" rx="6" fill="#fef2f2" stroke="#d63031" stroke-width="1"/>
  <text x="600" y="200" font-size="10" font-weight="600" fill="#2d3436">client-key.pem</text>
  <text x="600" y="218" font-size="9" fill="#636e72">TLS private key &#8212; generated locally, never leaves the container</text>
  <text x="940" y="200" font-size="9" font-weight="600" fill="#d63031">NEVER transmitted &#10007;</text>

  <rect x="580" y="242" width="450" height="50" rx="6" fill="#fff7ed" stroke="#e17055" stroke-width="1"/>
  <text x="600" y="260" font-size="10" font-weight="600" fill="#2d3436">client.pem</text>
  <text x="600" y="278" font-size="9" fill="#636e72">Public certificate &#8212; presented during mTLS handshake</text>
  <text x="940" y="260" font-size="9" font-weight="600" fill="#e17055">Sent during TLS &#8594;</text>

  <rect x="580" y="302" width="450" height="50" rx="6" fill="#fff7ed" stroke="#e17055" stroke-width="1"/>
  <text x="600" y="320" font-size="10" font-weight="600" fill="#2d3436">instance_id</text>
  <text x="600" y="338" font-size="9" fill="#636e72">Unique identifier &#8212; sent in heartbeat X-Instance-ID header</text>
  <text x="940" y="320" font-size="9" font-weight="600" fill="#e17055">Sent in heartbeat &#8594;</text>

  <!-- Agent isolation note -->
  <rect x="580" y="362" width="450" height="52" rx="6" fill="#ecfdf5" stroke="#00b894" stroke-width="1"/>
  <text x="600" y="382" font-size="9" font-weight="600" fill="#00b894">MINIMAL SURFACE</text>
  <text x="600" y="398" font-size="9" fill="#636e72">Non-root. Read-only Docker socket. No database access.</text>
  <text x="600" y="412" font-size="9" fill="#636e72">Only 3 credentials total. No business data stored.</text>

  <!-- ============================================================ -->
  <!-- MYSERVICE BOUNDARY (bottom, smaller) -->
  <!-- ============================================================ -->
  <rect x="30" y="462" width="1040" height="210" rx="14" fill="none" stroke="#6c5ce7" stroke-width="2.5" stroke-dasharray="8 4" filter="url(#shadow)"/>
  <rect x="30" y="462" width="1040" height="34" rx="14" fill="#6c5ce7"/>
  <rect x="30" y="488" width="1040" height="8" fill="#6c5ce7"/>
  <text x="550" y="485" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">MYSERVICE BOUNDARY (Control Plane + CI/CD)</text>

  <!-- Control Plane (left) -->
  <rect x="50" y="508" width="550" height="148" rx="10" fill="#fff" stroke="#dfe6e9" stroke-width="1" filter="url(#shadow)"/>
  <rect x="50" y="508" width="550" height="32" rx="10" fill="#6c5ce7"/>
  <rect x="50" y="532" width="550" height="8" fill="#6c5ce7"/>
  <text x="325" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Control Plane</text>

  <rect x="70" y="550" width="250" height="44" rx="6" fill="#fef2f2" stroke="#d63031" stroke-width="1"/>
  <text x="90" y="568" font-size="10" font-weight="600" fill="#2d3436">CA Private Key</text>
  <text x="90" y="584" font-size="9" fill="#636e72">HSM / KMS backed</text>
  <text x="250" y="568" font-size="9" font-weight="600" fill="#d63031">NEVER transmitted &#10007;</text>

  <rect x="70" y="602" width="510" height="42" rx="6" fill="#f8f9fa" stroke="#dfe6e9" stroke-width="1"/>
  <text x="90" y="618" font-size="9" font-weight="700" fill="#d63031">NO client DB credentials</text>
  <text x="250" y="618" font-size="9" font-weight="700" fill="#d63031">NO client APP_KEYs</text>
  <text x="395" y="618" font-size="9" font-weight="700" fill="#d63031">NO client passwords</text>
  <text x="90" y="634" font-size="9" font-weight="700" fill="#d63031">NO client API tokens</text>
  <text x="250" y="634" font-size="9" font-weight="700" fill="#d63031">NO client PII</text>

  <!-- CI/CD Pipeline (right) -->
  <rect x="620" y="508" width="430" height="148" rx="10" fill="#fff" stroke="#dfe6e9" stroke-width="1" filter="url(#shadow)"/>
  <rect x="620" y="508" width="430" height="32" rx="10" fill="#6c5ce7"/>
  <rect x="620" y="532" width="430" height="8" fill="#6c5ce7"/>
  <text x="835" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">CI/CD Pipeline</text>

  <rect x="640" y="550" width="390" height="44" rx="6" fill="#fef2f2" stroke="#d63031" stroke-width="1"/>
  <text x="660" y="568" font-size="10" font-weight="600" fill="#2d3436">Ed25519 Private Key</text>
  <text x="660" y="584" font-size="9" fill="#636e72">Encrypted at rest in CI secrets vault</text>
  <text x="950" y="568" font-size="9" font-weight="600" fill="#d63031">NEVER transmitted &#10007;</text>

  <rect x="640" y="602" width="390" height="42" rx="6" fill="#ecfdf5" stroke="#00b894" stroke-width="1"/>
  <text x="660" y="618" font-size="9" font-weight="600" fill="#00b894">SIGNING ONLY</text>
  <text x="660" y="634" font-size="9" fill="#636e72">Signs deploy artifacts. Agent verifies with embedded public key.</text>

  <!-- Footer -->
  <text x="550" y="692" text-anchor="middle" font-size="9" fill="#b2bec3">Partner Manager &#8212; Secrets Boundary Map &#8226; &#10007; = never crosses boundary &#8226; &#8594; = transmitted over encrypted channel</text>
</svg>