<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1100" height="800" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Agent &#8596; Control Plane Architecture</text>
  <text x="550" y="56" text-anchor="middle" font-size="11" fill="#6b7280">mTLS-secured communication loop: heartbeat, commands, signal relay, license enforcement, and fleet management</text>

  <!-- PM3 APPLICATION (left) -->
  <rect x="30" y="80" width="360" height="380" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="80" width="360" height="34" rx="10" fill="#2563eb"/>
  <rect x="30" y="106" width="360" height="8" fill="#2563eb"/>
  <text x="210" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Partner Manager 3 (Client App)</text>

  <!-- PM3 internal services -->
  <rect x="50" y="125" width="160" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="130" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Partner Manager App</text>
  <text x="130" y="164" text-anchor="middle" font-size="9" fill="#6b7280">PHP-FPM + Nginx</text>
  <text x="130" y="178" text-anchor="middle" font-size="9" fill="#6b7280">Port 80</text>

  <rect x="220" y="125" width="160" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="300" y="148" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">MySQL 8.0</text>
  <text x="300" y="164" text-anchor="middle" font-size="9" fill="#6b7280">Partners, Signals</text>
  <text x="300" y="178" text-anchor="middle" font-size="9" fill="#6b7280">Health Snapshots</text>

  <!-- Internal API endpoints -->
  <text x="50" y="204" font-size="10" font-weight="600" fill="#374151">Internal API Endpoints</text>
  <rect x="50" y="212" width="320" height="24" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="229" font-size="9" font-weight="600" fill="#374151">GET</text>
  <text x="90" y="229" font-size="9" fill="#6b7280">/api/v1/internal/metrics</text>

  <rect x="50" y="240" width="320" height="24" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="257" font-size="9" font-weight="600" fill="#374151">GET</text>
  <text x="90" y="257" font-size="9" fill="#6b7280">/api/internal/signal-aggregate</text>

  <rect x="50" y="268" width="320" height="24" rx="4" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="60" y="285" font-size="9" font-weight="600" fill="#374151">POST</text>
  <text x="96" y="285" font-size="9" fill="#6b7280">/api/internal/benchmarks</text>

  <!-- Shared volume -->
  <rect x="50" y="305" width="320" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="210" y="322" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Shared Volume: license-status.json</text>
  <text x="210" y="336" text-anchor="middle" font-size="9" fill="#6b7280">License status, tier, features, expiry</text>

  <!-- Scheduler -->
  <rect x="50" y="358" width="155" height="45" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1"/>
  <text x="127" y="376" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">Scheduler</text>
  <text x="127" y="392" text-anchor="middle" font-size="9" fill="#6b7280">signal:process (daily)</text>

  <rect x="215" y="358" width="155" height="45" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1"/>
  <text x="292" y="376" text-anchor="middle" font-size="10" font-weight="600" fill="#6b21a8">Signal Engine</text>
  <text x="292" y="392" text-anchor="middle" font-size="9" fill="#6b7280">8 processors, 73+ signals</text>

  <rect x="50" y="410" width="320" height="38" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
  <text x="210" y="430" text-anchor="middle" font-size="10" font-weight="600" fill="#7c3aed">Signal Aggregate Service</text>
  <text x="210" y="444" text-anchor="middle" font-size="9" fill="#6b7280">Anonymized portfolio stats (guarded by opt-in)</text>

  <!-- PM-AGENT (center) -->
  <rect x="430" y="80" width="240" height="380" rx="10" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="430" y="80" width="240" height="34" rx="10" fill="#d97706"/>
  <rect x="430" y="106" width="240" height="8" fill="#d97706"/>
  <text x="550" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">pm-agent (Sidecar)</text>

  <rect x="450" y="125" width="200" height="40" rx="6" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
  <text x="550" y="142" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Go Binary (Alpine)</text>
  <text x="550" y="158" text-anchor="middle" font-size="9" fill="#6b7280">Non-root, 5MB image</text>

  <rect x="450" y="175" width="200" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="550" y="195" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Heartbeat Loop (30s)</text>

  <rect x="450" y="215" width="200" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="550" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Health Collector</text>

  <rect x="450" y="255" width="200" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="550" y="275" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Command Executor</text>

  <rect x="450" y="295" width="200" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="550" y="315" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Signal Relay</text>

  <rect x="450" y="335" width="200" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="550" y="355" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Status Writer</text>

  <rect x="450" y="375" width="200" height="30" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="550" y="395" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">Docker Client (socket)</text>

  <!-- mTLS badge -->
  <rect x="450" y="415" width="200" height="34" rx="6" fill="#dc2626"/>
  <text x="550" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">mTLS (TLS 1.3)</text>

  <!-- CONTROL PLANE (right) -->
  <rect x="710" y="80" width="360" height="380" rx="10" fill="#fff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="710" y="80" width="360" height="34" rx="10" fill="#059669"/>
  <rect x="710" y="106" width="360" height="8" fill="#059669"/>
  <text x="890" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Control Plane (SaaS)</text>

  <!-- CP API endpoints -->
  <text x="730" y="132" font-size="10" font-weight="600" fill="#374151">Agent API (v1)</text>
  <rect x="730" y="140" width="320" height="24" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="740" y="157" font-size="9" font-weight="600" fill="#374151">POST</text>
  <text x="776" y="157" font-size="9" fill="#6b7280">/api/v1/agent/heartbeat</text>

  <rect x="730" y="168" width="320" height="24" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="740" y="185" font-size="9" font-weight="600" fill="#374151">POST</text>
  <text x="776" y="185" font-size="9" fill="#6b7280">/api/v1/agent/signals/aggregate</text>

  <rect x="730" y="196" width="320" height="24" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="740" y="213" font-size="9" font-weight="600" fill="#374151">GET</text>
  <text x="770" y="213" font-size="9" fill="#6b7280">/api/v1/agent/signals/benchmarks</text>

  <rect x="730" y="224" width="320" height="24" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="740" y="241" font-size="9" font-weight="600" fill="#374151">POST</text>
  <text x="776" y="241" font-size="9" fill="#6b7280">/api/v1/agent/certificates/issue|renew</text>

  <rect x="730" y="252" width="320" height="24" rx="4" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="740" y="269" font-size="9" font-weight="600" fill="#374151">POST</text>
  <text x="776" y="269" font-size="9" fill="#6b7280">/api/v1/agent/commands/{id}/report</text>

  <!-- CP Services -->
  <text x="730" y="296" font-size="10" font-weight="600" fill="#374151">Services</text>
  <rect x="730" y="304" width="150" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="805" y="324" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">HeartbeatService</text>

  <rect x="890" y="304" width="160" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="970" y="324" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">CertificateService (CA)</text>

  <rect x="730" y="340" width="150" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="805" y="360" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">SignalIngestion</text>

  <rect x="890" y="340" width="160" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="970" y="360" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">BenchmarkComputation</text>

  <rect x="730" y="376" width="150" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="805" y="396" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">LicenseService</text>

  <rect x="890" y="376" width="160" height="30" rx="4" fill="#d1fae5" stroke="#059669" stroke-width="1"/>
  <text x="970" y="396" text-anchor="middle" font-size="9" font-weight="600" fill="#166534">DeploymentService</text>

  <rect x="730" y="412" width="320" height="36" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="890" y="430" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Fleet Dashboard (Web UI)</text>
  <text x="890" y="444" text-anchor="middle" font-size="9" fill="#6b7280">Instances, Orders, Licenses, Signals, Catalog</text>

  <!-- COMMUNICATION ARROWS -->
  <!-- PM3 -> Agent (HTTP) -->
  <line x1="390" y1="190" x2="428" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <text x="409" y="184" text-anchor="middle" font-size="8" fill="#2563eb">HTTP</text>

  <!-- Agent -> PM3 (benchmarks) -->
  <line x1="428" y1="310" x2="390" y2="310" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- Agent -> CP (heartbeat) -->
  <line x1="672" y1="150" x2="728" y2="150" stroke="#d97706" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="700" y="142" text-anchor="middle" font-size="8" fill="#d97706">mTLS</text>

  <!-- CP -> Agent (commands + license) -->
  <line x1="728" y1="260" x2="672" y2="260" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowRed)"/>
  <text x="700" y="254" text-anchor="middle" font-size="8" fill="#dc2626">cmds</text>

  <!-- Agent -> CP (signals) -->
  <line x1="672" y1="182" x2="728" y2="182" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>

  <!-- CP -> Agent (benchmarks) -->
  <line x1="728" y1="212" x2="672" y2="212" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowGreen)"/>

  <!-- COMMUNICATION FLOW (bottom) -->
  <rect x="30" y="490" width="1040" height="290" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="550" y="516" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Heartbeat Cycle (every 30 seconds)</text>

  <!-- Steps -->
  <g font-size="10">
    <!-- Step 1 -->
    <rect x="50" y="535" width="185" height="70" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="68" cy="550" r="10" fill="#2563eb"/>
    <text x="68" y="554" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
    <text x="86" y="554" font-weight="600" fill="#1e40af">Collect Health</text>
    <text x="60" y="572" fill="#374151">Docker stats, app metrics</text>
    <text x="60" y="586" fill="#374151">Container status, memory</text>
    <text x="60" y="600" fill="#374151">CPU, network I/O</text>

    <!-- Step 2 -->
    <rect x="250" y="535" width="185" height="70" rx="6" fill="#fff7ed" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="268" cy="550" r="10" fill="#d97706"/>
    <text x="268" y="554" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text>
    <text x="286" y="554" font-weight="600" fill="#92400e">POST Heartbeat</text>
    <text x="260" y="572" fill="#374151">X-Instance-ID header</text>
    <text x="260" y="586" fill="#374151">Health payload + usage</text>
    <text x="260" y="600" fill="#374151">mTLS client certificate</text>

    <!-- Step 3 -->
    <rect x="450" y="535" width="185" height="70" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
    <circle cx="468" cy="550" r="10" fill="#059669"/>
    <text x="468" y="554" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">3</text>
    <text x="486" y="554" font-weight="600" fill="#166534">Process &#38; Respond</text>
    <text x="460" y="572" fill="#374151">Store metrics, update status</text>
    <text x="460" y="586" fill="#374151">Evaluate license warnings</text>
    <text x="460" y="600" fill="#374151">Return commands + license</text>

    <!-- Step 4 -->
    <rect x="650" y="535" width="185" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <circle cx="668" cy="550" r="10" fill="#dc2626"/>
    <text x="668" y="554" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">4</text>
    <text x="686" y="554" font-weight="600" fill="#dc2626">Execute Commands</text>
    <text x="660" y="572" fill="#374151">deploy: pull + restart</text>
    <text x="660" y="586" fill="#374151">push_signals: relay agg</text>
    <text x="660" y="600" fill="#374151">fetch_benchmarks: pull</text>

    <!-- Step 5 -->
    <rect x="850" y="535" width="200" height="70" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
    <circle cx="868" cy="550" r="10" fill="#7c3aed"/>
    <text x="868" y="554" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">5</text>
    <text x="886" y="554" font-weight="600" fill="#6b21a8">Write Status</text>
    <text x="860" y="572" fill="#374151">license-status.json &#8594; volume</text>
    <text x="860" y="586" fill="#374151">PM3 reads for enforcement</text>
    <text x="860" y="600" fill="#374151">Tier, features, expiry</text>
  </g>

  <!-- Arrows between steps -->
  <line x1="235" y1="570" x2="248" y2="570" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="435" y1="570" x2="448" y2="570" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="635" y1="570" x2="648" y2="570" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="835" y1="570" x2="848" y2="570" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Signal relay detail -->
  <rect x="50" y="625" width="1000" height="60" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1"/>
  <text x="60" y="646" font-size="10" font-weight="600" fill="#7c3aed">Signal Relay Flow (push_signals command):</text>
  <text x="60" y="664" font-size="10" fill="#374151">Agent GET /api/internal/signal-aggregate &#8594; PM3 returns anonymized portfolio stats &#8594; Agent POST /api/v1/agent/signals/aggregate &#8594; Control Plane stores in signal_aggregates</text>
  <text x="60" y="678" font-size="10" fill="#374151">Control Plane computes cohort benchmarks (min 5 opted-in instances) &#8594; Agent GET /api/v1/agent/signals/benchmarks &#8594; Agent POST /api/internal/benchmarks &#8594; PM3</text>

  <!-- Security note -->
  <rect x="50" y="700" width="1000" height="46" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
  <text x="60" y="718" font-size="10" font-weight="600" fill="#dc2626">Security Model:</text>
  <text x="60" y="734" font-size="10" fill="#374151">mTLS with TLS 1.3 minimum &#8226; CA cert + client cert + client key (PEM) &#8226; Certificate fingerprint stored on Instance model &#8226; Ed25519 signature verification for deployments</text>
  <text x="60" y="748" font-size="10" fill="#374151">Internal agent &#8596; PM3 communication: plain HTTP over Docker internal network (no auth) &#8226; Agent runs as non-root user (pmagent:pmagent)</text>

  <!-- Footer -->
  <text x="550" y="790" text-anchor="middle" font-size="9" fill="#9ca3af">pm-agent (Go sidecar) &#8596; Partner Manager 3 (PHP) &#8596; Control Plane (Laravel) &#8212; heartbeat interval configurable (default 30s)</text>
</svg>
