<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowDark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1100" height="860" fill="#f8fafc" rx="12"/>

  <!-- INTERNAL USE ONLY banner -->
  <rect x="0" y="0" width="1100" height="24" rx="12" fill="#dc2626"/>
  <text x="550" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">INTERNAL USE ONLY &#8212; Control Plane Architecture</text>

  <!-- Title -->
  <text x="550" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Control Plane Architecture</text>
  <text x="550" y="70" text-anchor="middle" font-size="11" fill="#6b7280">Fleet orchestration, licensing, signal ingestion, benchmarking, and provisioning</text>

  <!-- FLEET DASHBOARD (Web UI - top left) -->
  <rect x="30" y="90" width="520" height="200" rx="10" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="90" width="520" height="32" rx="10" fill="#2563eb"/>
  <rect x="30" y="116" width="520" height="6" fill="#2563eb"/>
  <text x="290" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Fleet Dashboard (Web UI &#8212; Session Auth)</text>

  <g font-size="10">
    <rect x="50" y="135" width="110" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="105" y="154" text-anchor="middle" font-weight="600" fill="#1e40af">Dashboard</text>

    <rect x="170" y="135" width="110" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="225" y="154" text-anchor="middle" font-weight="600" fill="#1e40af">Instances</text>

    <rect x="290" y="135" width="110" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="345" y="154" text-anchor="middle" font-weight="600" fill="#1e40af">Orders</text>

    <rect x="410" y="135" width="120" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="470" y="154" text-anchor="middle" font-weight="600" fill="#1e40af">Licenses</text>

    <rect x="50" y="172" width="110" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="105" y="191" text-anchor="middle" font-weight="600" fill="#1e40af">Catalog</text>

    <rect x="170" y="172" width="110" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="225" y="191" text-anchor="middle" font-weight="600" fill="#1e40af">Releases</text>

    <rect x="290" y="172" width="110" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="345" y="191" text-anchor="middle" font-weight="600" fill="#1e40af">Signals</text>

    <rect x="410" y="172" width="120" height="28" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
    <text x="470" y="191" text-anchor="middle" font-weight="600" fill="#1e40af">AWS Admin</text>
  </g>

  <text x="50" y="224" font-size="10" font-weight="600" fill="#374151">Key Actions:</text>
  <text x="50" y="240" font-size="9" fill="#6b7280">Create orders &#8594; Approve &#8594; Auto-provision instance + license &#8226; Deploy releases across fleet &#8226; Monitor heartbeats &#38; usage</text>
  <text x="50" y="256" font-size="9" fill="#6b7280">View signal aggregates per instance &#8226; Manage products &#38; pricing &#8226; AWS infrastructure dashboard</text>
  <text x="50" y="272" font-size="9" fill="#6b7280">Download config packages (self-hosted) &#8226; Restart instances remotely &#8226; Manage instance certificates</text>

  <!-- AGENT API (top right) -->
  <rect x="570" y="90" width="500" height="200" rx="10" fill="#fff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="570" y="90" width="500" height="32" rx="10" fill="#059669"/>
  <rect x="570" y="116" width="500" height="6" fill="#059669"/>
  <text x="820" y="113" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Agent API (v1 &#8212; mTLS Auth)</text>

  <g font-size="9">
    <rect x="590" y="135" width="220" height="24" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="600" y="151" font-weight="600" fill="#059669">POST</text>
    <text x="640" y="151" fill="#374151">/api/v1/agent/heartbeat</text>

    <rect x="590" y="163" width="220" height="24" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="600" y="179" font-weight="600" fill="#059669">POST</text>
    <text x="640" y="179" fill="#374151">/api/v1/agent/signals/aggregate</text>

    <rect x="590" y="191" width="220" height="24" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="600" y="207" font-weight="600" fill="#059669">GET</text>
    <text x="634" y="207" fill="#374151">/api/v1/agent/signals/benchmarks</text>

    <rect x="830" y="135" width="220" height="24" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="840" y="151" font-weight="600" fill="#059669">POST</text>
    <text x="880" y="151" fill="#374151">/api/v1/agent/certificates/issue</text>

    <rect x="830" y="163" width="220" height="24" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="840" y="179" font-weight="600" fill="#059669">POST</text>
    <text x="880" y="179" fill="#374151">/api/v1/agent/certificates/renew</text>

    <rect x="830" y="191" width="220" height="24" rx="3" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
    <text x="840" y="207" font-weight="600" fill="#059669">POST</text>
    <text x="880" y="207" fill="#374151">/api/v1/agent/commands/{id}/report</text>
  </g>

  <text x="590" y="240" font-size="9" fill="#6b7280">Auth: mTLS &#8212; agent presents client cert signed by CP&#x27;s CA. X-Instance-ID header identifies the instance.</text>
  <text x="590" y="256" font-size="9" fill="#6b7280">Heartbeat response includes: pending commands[], license status, feature entitlements, expiry warnings.</text>

  <!-- SERVICES LAYER -->
  <text x="550" y="316" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Core Services</text>

  <!-- Heartbeat Service -->
  <rect x="30" y="330" width="230" height="130" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="330" width="230" height="26" rx="8" fill="#059669"/>
  <rect x="30" y="350" width="230" height="6" fill="#059669"/>
  <text x="145" y="349" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">HeartbeatService</text>
  <text x="46" y="376" font-size="9" fill="#374151">&#8226; Store metrics (CPU, mem, disk)</text>
  <text x="46" y="392" font-size="9" fill="#374151">&#8226; Update instance status + version</text>
  <text x="46" y="408" font-size="9" fill="#374151">&#8226; Record usage for billing</text>
  <text x="46" y="424" font-size="9" fill="#374151">&#8226; Evaluate license warnings</text>
  <text x="46" y="440" font-size="9" fill="#374151">&#8226; Return pending commands</text>
  <text x="46" y="456" font-size="9" fill="#6b7280">Creates: Heartbeat record</text>

  <!-- Certificate Service -->
  <rect x="280" y="330" width="230" height="130" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="280" y="330" width="230" height="26" rx="8" fill="#dc2626"/>
  <rect x="280" y="350" width="230" height="6" fill="#dc2626"/>
  <text x="395" y="349" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">CertificateService (CA)</text>
  <text x="296" y="376" font-size="9" fill="#374151">&#8226; Issue new client certificates</text>
  <text x="296" y="392" font-size="9" fill="#374151">&#8226; Sign with self-signed CA</text>
  <text x="296" y="408" font-size="9" fill="#374151">&#8226; Store fingerprint on Instance</text>
  <text x="296" y="424" font-size="9" fill="#374151">&#8226; Renew (revoke old, issue new)</text>
  <text x="296" y="440" font-size="9" fill="#374151">&#8226; Validity: 365 days</text>
  <text x="296" y="456" font-size="9" fill="#6b7280">TODO: External CA (Vault/KMS)</text>

  <!-- License Service -->
  <rect x="530" y="330" width="250" height="130" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="530" y="330" width="250" height="26" rx="8" fill="#d97706"/>
  <rect x="530" y="350" width="250" height="6" fill="#d97706"/>
  <text x="655" y="349" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">LicenseService</text>
  <text x="546" y="376" font-size="9" fill="#374151">&#8226; Record usage snapshots (monthly)</text>
  <text x="546" y="392" font-size="9" fill="#374151">&#8226; Evaluate license compliance</text>
  <text x="546" y="408" font-size="9" fill="#374151">&#8226; Check partner/user limits</text>
  <text x="546" y="424" font-size="9" fill="#374151">&#8226; Grace period management</text>
  <text x="546" y="440" font-size="9" fill="#374151">&#8226; Expiry &#38; over-limit warnings</text>
  <text x="546" y="456" font-size="9" fill="#6b7280">v1 (tier) + v2 (product entitlements)</text>

  <!-- Signal + Benchmark Service -->
  <rect x="800" y="330" width="270" height="130" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="800" y="330" width="270" height="26" rx="8" fill="#7c3aed"/>
  <rect x="800" y="350" width="270" height="6" fill="#7c3aed"/>
  <text x="935" y="349" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Signal &#38; Benchmark Services</text>
  <text x="816" y="376" font-size="9" fill="#374151" font-weight="600">SignalIngestionService:</text>
  <text x="816" y="392" font-size="9" fill="#6b7280">Update profile + store aggregate</text>
  <text x="816" y="412" font-size="9" fill="#374151" font-weight="600">BenchmarkComputationService:</text>
  <text x="816" y="428" font-size="9" fill="#6b7280">Group by (partner_count, acv, offering)</text>
  <text x="816" y="444" font-size="9" fill="#6b7280">Min 5 opted-in instances per cohort</text>
  <text x="816" y="456" font-size="9" fill="#6b7280">p25, median, p75, mean metrics</text>

  <!-- DATA MODEL LAYER -->
  <text x="550" y="492" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Data Model</text>

  <!-- Fleet Management tables -->
  <rect x="30" y="506" width="250" height="160" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="506" width="250" height="26" rx="8" fill="#2563eb"/>
  <rect x="30" y="526" width="250" height="6" fill="#2563eb"/>
  <text x="155" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Fleet Management</text>
  <text x="46" y="550" font-size="9" fill="#374151" font-weight="600">instances</text>
  <text x="150" y="550" font-size="9" fill="#6b7280">id, name, client, status, versions</text>
  <text x="46" y="566" font-size="9" fill="#374151" font-weight="600">certificates</text>
  <text x="150" y="566" font-size="9" fill="#6b7280">fingerprint, PEM, issued/expires</text>
  <text x="46" y="582" font-size="9" fill="#374151" font-weight="600">releases</text>
  <text x="150" y="582" font-size="9" fill="#6b7280">version, image, signature, changelog</text>
  <text x="46" y="598" font-size="9" fill="#374151" font-weight="600">deployments</text>
  <text x="150" y="598" font-size="9" fill="#6b7280">instance+release, status tracking</text>
  <text x="46" y="614" font-size="9" fill="#374151" font-weight="600">commands</text>
  <text x="150" y="614" font-size="9" fill="#6b7280">type, payload, status, result</text>
  <text x="46" y="630" font-size="9" fill="#374151" font-weight="600">heartbeats</text>
  <text x="150" y="630" font-size="9" fill="#6b7280">metrics, containers, app_metrics</text>
  <text x="46" y="646" font-size="9" fill="#374151" font-weight="600">usage_snapshots</text>
  <text x="150" y="646" font-size="9" fill="#6b7280">monthly billing counters</text>

  <!-- Licensing tables -->
  <rect x="300" y="506" width="250" height="160" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="506" width="250" height="26" rx="8" fill="#d97706"/>
  <rect x="300" y="526" width="250" height="6" fill="#d97706"/>
  <text x="425" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Licensing &#38; Ordering</text>
  <text x="316" y="550" font-size="9" fill="#374151" font-weight="600">orders</text>
  <text x="380" y="550" font-size="9" fill="#6b7280">client info, tier, pricing, status</text>
  <text x="316" y="566" font-size="9" fill="#374151" font-weight="600">licenses</text>
  <text x="380" y="566" font-size="9" fill="#6b7280">key, type, tier, limits, expiry</text>
  <text x="316" y="582" font-size="9" fill="#374151" font-weight="600">license_entitlements</text>
  <text x="430" y="582" font-size="9" fill="#6b7280">v2 per-product grants</text>
  <text x="316" y="598" font-size="9" fill="#374151" font-weight="600">products</text>
  <text x="380" y="598" font-size="9" fill="#6b7280">slug, category, features</text>
  <text x="316" y="614" font-size="9" fill="#374151" font-weight="600">package_templates</text>
  <text x="430" y="614" font-size="9" fill="#6b7280">pre-configured bundles</text>
  <text x="316" y="630" font-size="9" fill="#374151" font-weight="600">product_prices</text>
  <text x="420" y="630" font-size="9" fill="#6b7280">pricing per schedule</text>
  <text x="316" y="646" font-size="9" fill="#374151" font-weight="600">price_schedules</text>
  <text x="420" y="646" font-size="9" fill="#6b7280">versioned tier pricing</text>

  <!-- Signal Network tables -->
  <rect x="570" y="506" width="250" height="100" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="570" y="506" width="250" height="26" rx="8" fill="#7c3aed"/>
  <rect x="570" y="526" width="250" height="6" fill="#7c3aed"/>
  <text x="695" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Signal Network</text>
  <text x="586" y="550" font-size="9" fill="#374151" font-weight="600">signal_aggregates</text>
  <text x="700" y="550" font-size="9" fill="#6b7280">per-instance, per-date</text>
  <text x="586" y="566" font-size="9" fill="#374151" font-weight="600">instance_profiles</text>
  <text x="700" y="566" font-size="9" fill="#6b7280">cohort classification</text>
  <text x="586" y="582" font-size="9" fill="#374151" font-weight="600">cohort_benchmarks</text>
  <text x="700" y="582" font-size="9" fill="#6b7280">computed p25/median/p75</text>
  <text x="586" y="598" font-size="9" fill="#6b7280">Cohort grouping: partner_count_range + acv_range + offering_type</text>

  <!-- AWS tables -->
  <rect x="840" y="506" width="230" height="100" rx="8" fill="#fff" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="840" y="506" width="230" height="26" rx="8" fill="#f97316"/>
  <rect x="840" y="526" width="230" height="6" fill="#f97316"/>
  <text x="955" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">AWS Infrastructure</text>
  <text x="856" y="550" font-size="9" fill="#374151" font-weight="600">aws_resources</text>
  <text x="946" y="550" font-size="9" fill="#6b7280">per-instance infra tracking</text>
  <text x="856" y="566" font-size="9" fill="#374151" font-weight="600">aws_settings</text>
  <text x="946" y="566" font-size="9" fill="#6b7280">encrypted config (key/value)</text>
  <text x="856" y="582" font-size="9" fill="#374151" font-weight="600">provisioning_logs</text>
  <text x="960" y="582" font-size="9" fill="#6b7280">audit trail per instance</text>

  <!-- INFRASTRUCTURE -->
  <rect x="30" y="685" width="1040" height="80" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="50" y="708" font-size="11" font-weight="700" fill="#374151">Infrastructure &#38; Configuration</text>
  <text x="50" y="726" font-size="10" fill="#6b7280">Database: SQLite (dev) / PostgreSQL (prod) &#8226; Port: 8081 (dev) &#8226; Background Jobs: ProvisionHostedInstance (queue)</text>
  <text x="50" y="742" font-size="10" fill="#6b7280">AWS SDK: LocalStack (dev, port 4566) / Real AWS (prod) &#8226; Services: S3, RDS, ECS, ALB, Route53, ACM, CloudWatch, IAM</text>
  <text x="50" y="758" font-size="10" fill="#6b7280">Docker network: pm-shared (connects to all agent instances) &#8226; Session auth for web UI, mTLS for agent API &#8226; No Redis required</text>

  <!-- FLEET VISUALIZATION -->
  <rect x="30" y="780" width="1040" height="56" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="50" y="800" font-size="10" font-weight="700" fill="#374151">Fleet Scale:</text>
  <text x="140" y="800" font-size="10" fill="#6b7280">Each Instance = 1 PM3 deployment + 1 pm-agent &#8226; Control plane manages N instances simultaneously</text>
  <text x="50" y="818" font-size="10" fill="#6b7280">Heartbeats at 30s intervals &#8226; Usage snapshots monthly &#8226; Benchmarks computed across opted-in instances &#8226; Deployments can target single or batch instances</text>

  <!-- Footer -->
  <text x="550" y="852" text-anchor="middle" font-size="9" fill="#9ca3af">INTERNAL &#8212; Control Plane: pm-control-plane (PHP 8.4) &#8212; manages fleet of Partner Manager instances</text>
</svg>
