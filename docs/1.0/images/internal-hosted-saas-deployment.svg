<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowDark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
  </defs>

  <rect width="1100" height="820" fill="#f8fafc" rx="12"/>

  <!-- INTERNAL USE ONLY banner -->
  <rect x="0" y="0" width="1100" height="24" rx="12" fill="#dc2626"/>
  <text x="550" y="16" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">INTERNAL USE ONLY &#8212; Hosted / SaaS Deployment Architecture</text>

  <!-- Title -->
  <text x="550" y="52" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Hosted (SaaS) Deployment</text>
  <text x="550" y="70" text-anchor="middle" font-size="11" fill="#6b7280">AWS-provisioned infrastructure managed by the control plane &#8212; each client gets isolated resources</text>

  <!-- AWS VPC BOUNDARY -->
  <rect x="30" y="90" width="1040" height="510" rx="12" fill="#fff" stroke="#f97316" stroke-width="2"/>
  <rect x="30" y="90" width="1040" height="28" rx="12" fill="#f97316"/>
  <text x="550" y="109" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">AWS VPC (Provisioned per Order)</text>

  <!-- ALB -->
  <rect x="50" y="135" width="200" height="100" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="135" width="200" height="26" rx="8" fill="#2563eb"/>
  <rect x="50" y="155" width="200" height="6" fill="#2563eb"/>
  <text x="150" y="154" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ALB (Load Balancer)</text>
  <text x="66" y="180" font-size="9" fill="#374151">Host-based routing</text>
  <text x="66" y="196" font-size="9" fill="#374151">HTTPS termination (ACM cert)</text>
  <text x="66" y="212" font-size="9" fill="#6b7280">Target group per instance</text>
  <text x="66" y="228" font-size="9" fill="#6b7280">Custom domain support</text>

  <!-- Route53 -->
  <rect x="50" y="250" width="200" height="60" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="250" width="200" height="26" rx="8" fill="#7c3aed"/>
  <rect x="50" y="270" width="200" height="6" fill="#7c3aed"/>
  <text x="150" y="269" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Route53 DNS</text>
  <text x="66" y="294" font-size="9" fill="#374151">CNAME &#8594; ALB endpoint</text>
  <text x="66" y="308" font-size="9" fill="#6b7280">{client}.partner-manager.app</text>

  <!-- ACM -->
  <rect x="50" y="325" width="200" height="50" rx="8" fill="#fff" stroke="#0891b2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="50" y="325" width="200" height="26" rx="8" fill="#0891b2"/>
  <rect x="50" y="345" width="200" height="6" fill="#0891b2"/>
  <text x="150" y="344" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">ACM Certificate</text>
  <text x="66" y="368" font-size="9" fill="#374151">DNS-validated TLS cert</text>

  <!-- ECS CLUSTER -->
  <rect x="280" y="135" width="480" height="340" rx="10" fill="#f3f4f6" stroke="#059669" stroke-width="2"/>
  <text x="520" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">ECS Fargate Cluster (per client)</text>

  <!-- App Task -->
  <rect x="300" y="170" width="210" height="180" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="300" y="170" width="210" height="28" rx="8" fill="#2563eb"/>
  <rect x="300" y="192" width="210" height="6" fill="#2563eb"/>
  <text x="405" y="191" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">App Container (ECS Task)</text>
  <text x="316" y="218" font-size="9" fill="#374151" font-weight="600">Image: ghcr.io/.../pm3:latest</text>
  <text x="316" y="236" font-size="9" fill="#6b7280">Nginx + PHP-FPM + Supervisor</text>
  <text x="316" y="252" font-size="9" fill="#6b7280">Laravel scheduler (in-container)</text>
  <text x="316" y="268" font-size="9" fill="#6b7280">Signal Engine workers</text>
  <text x="316" y="286" font-size="9" fill="#6b7280">Port: 80 &#8594; ALB target group</text>
  <text x="316" y="304" font-size="9" fill="#374151" font-weight="600">Resources:</text>
  <text x="316" y="320" font-size="9" fill="#6b7280">CPU: configurable (Fargate)</text>
  <text x="316" y="336" font-size="9" fill="#6b7280">Memory: configurable</text>

  <!-- Agent Sidecar Task -->
  <rect x="530" y="170" width="210" height="180" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="530" y="170" width="210" height="28" rx="8" fill="#d97706"/>
  <rect x="530" y="192" width="210" height="6" fill="#d97706"/>
  <text x="635" y="191" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Agent Sidecar (ECS Task)</text>
  <text x="546" y="218" font-size="9" fill="#374151" font-weight="600">Image: ghcr.io/.../pm-agent</text>
  <text x="546" y="236" font-size="9" fill="#6b7280">Go binary (Alpine, ~5MB)</text>
  <text x="546" y="252" font-size="9" fill="#6b7280">Heartbeat every 30s</text>
  <text x="546" y="268" font-size="9" fill="#6b7280">mTLS to control plane</text>
  <text x="546" y="286" font-size="9" fill="#6b7280">Signal relay, command exec</text>
  <text x="546" y="304" font-size="9" fill="#374151" font-weight="600">Secrets:</text>
  <text x="546" y="320" font-size="9" fill="#6b7280">CA cert, client cert, client key</text>
  <text x="546" y="336" font-size="9" fill="#6b7280">config.yaml with CP URL</text>

  <!-- Arrow between app and agent -->
  <line x1="510" y1="260" x2="528" y2="260" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <text x="519" y="254" text-anchor="middle" font-size="7" fill="#374151">HTTP</text>

  <!-- ECS Task Definition note -->
  <rect x="300" y="360" width="440" height="50" rx="6" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="320" y="380" font-size="10" font-weight="600" fill="#166534">ECS Task Definition</text>
  <text x="320" y="396" font-size="9" fill="#6b7280">App container (essential) + Agent sidecar (essential) &#8226; Shared task network namespace &#8226; Fargate launch type</text>
  <text x="320" y="410" font-size="9" fill="#6b7280">Environment variables injected from control plane order &#8226; Image digest pinned per release version</text>

  <!-- CloudWatch -->
  <rect x="300" y="425" width="220" height="45" rx="6" fill="#fff" stroke="#6b7280" stroke-width="1" filter="url(#shadow)"/>
  <rect x="300" y="425" width="220" height="22" rx="6" fill="#6b7280"/>
  <text x="410" y="441" text-anchor="middle" font-size="10" font-weight="600" fill="#fff">CloudWatch Logs</text>
  <text x="316" y="460" font-size="9" fill="#6b7280">30-day retention, per-instance log group</text>

  <!-- RDS -->
  <rect x="790" y="135" width="260" height="140" rx="8" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="790" y="135" width="260" height="28" rx="8" fill="#d97706"/>
  <rect x="790" y="157" width="260" height="6" fill="#d97706"/>
  <text x="920" y="155" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">RDS PostgreSQL</text>
  <text x="806" y="182" font-size="9" fill="#374151">Isolated database per client</text>
  <text x="806" y="198" font-size="9" fill="#374151">Encryption at rest (AES-256)</text>
  <text x="806" y="214" font-size="9" fill="#374151">Automated backups</text>
  <text x="806" y="230" font-size="9" fill="#374151">Multi-AZ (optional)</text>
  <text x="806" y="246" font-size="9" fill="#6b7280">Instance class per order tier</text>
  <text x="806" y="262" font-size="9" fill="#6b7280">Subnet group: private subnets</text>

  <!-- S3 -->
  <rect x="790" y="290" width="260" height="90" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="790" y="290" width="260" height="28" rx="8" fill="#059669"/>
  <rect x="790" y="312" width="260" height="6" fill="#059669"/>
  <text x="920" y="310" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">S3 Bucket</text>
  <text x="806" y="336" font-size="9" fill="#374151">Per-client storage bucket</text>
  <text x="806" y="352" font-size="9" fill="#374151">SSE-S3 encryption, versioning</text>
  <text x="806" y="368" font-size="9" fill="#6b7280">Public access blocked</text>

  <!-- Connection arrows -->
  <line x1="250" y1="185" x2="278" y2="185" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="760" y1="260" x2="788" y2="200" stroke="#d97706" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="760" y1="260" x2="788" y2="335" stroke="#059669" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- PROVISIONING FLOW (bottom) -->
  <rect x="30" y="620" width="1040" height="180" rx="10" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="550" y="644" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Provisioning Workflow (Order Fulfillment)</text>

  <!-- Steps -->
  <rect x="50" y="660" width="180" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="68" cy="680" r="10" fill="#2563eb"/>
  <text x="68" y="684" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">1</text>
  <text x="86" y="680" font-size="9" font-weight="600" fill="#1e40af">Order Approved</text>
  <text x="60" y="698" font-size="8" fill="#6b7280">OrderService::fulfill()</text>
  <text x="60" y="712" font-size="8" fill="#6b7280">Generate inst_{slug}{seq}</text>

  <rect x="250" y="660" width="180" height="60" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <circle cx="268" cy="680" r="10" fill="#059669"/>
  <text x="268" y="684" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">2</text>
  <text x="286" y="680" font-size="9" font-weight="600" fill="#166534">Create Resources</text>
  <text x="260" y="698" font-size="8" fill="#6b7280">S3 bucket + RDS instance</text>
  <text x="260" y="712" font-size="8" fill="#6b7280">CloudWatch log group</text>

  <rect x="450" y="660" width="180" height="60" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="468" cy="680" r="10" fill="#d97706"/>
  <text x="468" y="684" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">3</text>
  <text x="486" y="680" font-size="9" font-weight="600" fill="#92400e">Deploy Containers</text>
  <text x="460" y="698" font-size="8" fill="#6b7280">ECS task definition</text>
  <text x="460" y="712" font-size="8" fill="#6b7280">App + agent containers</text>

  <rect x="650" y="660" width="180" height="60" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <circle cx="668" cy="680" r="10" fill="#7c3aed"/>
  <text x="668" y="684" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">4</text>
  <text x="686" y="680" font-size="9" font-weight="600" fill="#6b21a8">Configure DNS</text>
  <text x="660" y="698" font-size="8" fill="#6b7280">Route53 CNAME &#8594; ALB</text>
  <text x="660" y="712" font-size="8" fill="#6b7280">ACM cert (DNS validation)</text>

  <rect x="850" y="660" width="200" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="868" cy="680" r="10" fill="#2563eb"/>
  <text x="868" y="684" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">5</text>
  <text x="886" y="680" font-size="9" font-weight="600" fill="#1e40af">Issue License &#38; Certs</text>
  <text x="860" y="698" font-size="8" fill="#6b7280">LIC-{SLUG}-{YEAR}-{SEQ}</text>
  <text x="860" y="712" font-size="8" fill="#6b7280">mTLS client cert + CA</text>

  <!-- Step arrows -->
  <line x1="230" y1="690" x2="248" y2="690" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="430" y1="690" x2="448" y2="690" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="630" y1="690" x2="648" y2="690" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="830" y1="690" x2="848" y2="690" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- License key types -->
  <rect x="50" y="735" width="1000" height="46" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="70" y="754" font-size="10" font-weight="600" fill="#374151">License Types:</text>
  <text x="195" y="754" font-size="10" fill="#6b7280">v1 (tier-based): Professional / Enterprise with fixed partner/user limits</text>
  <text x="70" y="770" font-size="10" fill="#6b7280">v2 (product-based): Per-product entitlements with flexible pricing models (per_user, per_partner, flat) &#8226; Billing: monthly or annual</text>

  <!-- Footer -->
  <text x="550" y="812" text-anchor="middle" font-size="9" fill="#9ca3af">INTERNAL &#8212; Hosted Deployment: fully managed by control plane, per-client AWS resource isolation, automated provisioning via ProvisionHostedInstance job</text>
</svg>
