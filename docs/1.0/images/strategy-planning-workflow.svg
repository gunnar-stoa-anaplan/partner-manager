<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowDark" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#374151"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Strategy Planning Workflow</text>
  <text x="550" y="56" text-anchor="middle" font-size="11" fill="#6b7280">Plan creation &#8594; versioning &#8594; scenarios &#8594; targets/budgets/initiatives &#8594; actuals comparison &#8594; QBR review</text>

  <!-- PLAN LIFECYCLE (top row) -->
  <text x="550" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Plan Lifecycle</text>

  <!-- Draft -->
  <rect x="40" y="100" width="180" height="90" rx="8" fill="#fff" stroke="#6b7280" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="100" width="180" height="28" rx="8" fill="#6b7280"/>
  <rect x="40" y="120" width="180" height="8" fill="#6b7280"/>
  <text x="130" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Draft</text>
  <text x="56" y="148" font-size="9" fill="#374151">&#8226; Name, fiscal year, period</text>
  <text x="56" y="162" font-size="9" fill="#374151">&#8226; Add targets, budgets, initiatives</text>
  <text x="56" y="176" font-size="9" fill="#374151">&#8226; Define assumptions</text>

  <!-- Committed -->
  <rect x="270" y="100" width="180" height="90" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="270" y="100" width="180" height="28" rx="8" fill="#2563eb"/>
  <rect x="270" y="120" width="180" height="8" fill="#2563eb"/>
  <text x="360" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Committed</text>
  <text x="286" y="148" font-size="9" fill="#374151">&#8226; Locked for execution</text>
  <text x="286" y="162" font-size="9" fill="#374151">&#8226; committed_at timestamp</text>
  <text x="286" y="176" font-size="9" fill="#374151">&#8226; committed_by user recorded</text>

  <!-- Active -->
  <rect x="500" y="100" width="180" height="90" rx="8" fill="#fff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="500" y="100" width="180" height="28" rx="8" fill="#059669"/>
  <rect x="500" y="120" width="180" height="8" fill="#059669"/>
  <text x="590" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Active</text>
  <text x="516" y="148" font-size="9" fill="#374151">&#8226; Currently executing</text>
  <text x="516" y="162" font-size="9" fill="#374151">&#8226; Actuals accumulate</text>
  <text x="516" y="176" font-size="9" fill="#374151">&#8226; Reviews scheduled</text>

  <!-- Closed -->
  <rect x="730" y="100" width="180" height="90" rx="8" fill="#fff" stroke="#374151" stroke-width="2" filter="url(#shadow)"/>
  <rect x="730" y="100" width="180" height="28" rx="8" fill="#374151"/>
  <rect x="730" y="120" width="180" height="8" fill="#374151"/>
  <text x="820" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Closed</text>
  <text x="746" y="148" font-size="9" fill="#374151">&#8226; Plan complete or superseded</text>
  <text x="746" y="162" font-size="9" fill="#374151">&#8226; Historical reference</text>
  <text x="746" y="176" font-size="9" fill="#374151">&#8226; Can be re-versioned</text>

  <!-- Re-Version -->
  <rect x="940" y="100" width="130" height="90" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="100" width="130" height="28" rx="8" fill="#7c3aed"/>
  <rect x="940" y="120" width="130" height="8" fill="#7c3aed"/>
  <text x="1005" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Re-Version</text>
  <text x="952" y="148" font-size="9" fill="#374151">&#8226; parent_plan_id link</text>
  <text x="952" y="162" font-size="9" fill="#374151">&#8226; version incremented</text>
  <text x="952" y="176" font-size="9" fill="#374151">&#8226; New draft created</text>

  <!-- Lifecycle arrows -->
  <line x1="220" y1="145" x2="268" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="450" y1="145" x2="498" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <line x1="680" y1="145" x2="728" y2="145" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowDark)"/>
  <!-- Re-version arrow curves back -->
  <path d="M 1005 190 L 1005 210 Q 1005 220 995 220 L 140 220 Q 130 220 130 210 L 130 192" stroke="#7c3aed" stroke-width="1.5" fill="none" stroke-dasharray="6,3" marker-end="url(#arrowPurple)"/>
  <text x="570" y="216" text-anchor="middle" font-size="9" font-weight="600" fill="#7c3aed">Re-version creates new Draft linked to parent</text>

  <!-- PLAN COMPONENTS (center area) -->
  <text x="550" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Plan Components</text>

  <!-- Targets -->
  <rect x="40" y="270" width="195" height="160" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="270" width="195" height="28" rx="8" fill="#2563eb"/>
  <rect x="40" y="290" width="195" height="8" fill="#2563eb"/>
  <text x="137" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Targets</text>
  <text x="56" y="318" font-size="9" fill="#374151" font-weight="600">Categories:</text>
  <text x="56" y="334" font-size="9" fill="#6b7280">revenue, pipeline, growth</text>
  <text x="56" y="348" font-size="9" fill="#6b7280">enablement, certification, delivery</text>
  <text x="56" y="366" font-size="9" fill="#374151" font-weight="600">Metrics:</text>
  <text x="56" y="382" font-size="9" fill="#6b7280">target_value vs. actual_value</text>
  <text x="56" y="396" font-size="9" fill="#6b7280">Q1&#8211;Q4 targets &#38; actuals</text>
  <text x="56" y="410" font-size="9" fill="#6b7280">Attainment % &#38; variance %</text>

  <!-- Budgets -->
  <rect x="250" y="270" width="195" height="160" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="250" y="270" width="195" height="28" rx="8" fill="#059669"/>
  <rect x="250" y="290" width="195" height="8" fill="#059669"/>
  <text x="347" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Budgets</text>
  <text x="266" y="318" font-size="9" fill="#374151" font-weight="600">Categories:</text>
  <text x="266" y="334" font-size="9" fill="#6b7280">mdf, enablement, events</text>
  <text x="266" y="348" font-size="9" fill="#6b7280">tooling, headcount, marketing, travel</text>
  <text x="266" y="366" font-size="9" fill="#374151" font-weight="600">Tracking:</text>
  <text x="266" y="382" font-size="9" fill="#6b7280">planned_amount vs. actual_amount</text>
  <text x="266" y="396" font-size="9" fill="#6b7280">Q1&#8211;Q4 planned &#38; actuals</text>
  <text x="266" y="410" font-size="9" fill="#6b7280">Utilization %</text>

  <!-- Initiatives -->
  <rect x="460" y="270" width="195" height="160" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="460" y="270" width="195" height="28" rx="8" fill="#d97706"/>
  <rect x="460" y="290" width="195" height="8" fill="#d97706"/>
  <text x="557" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Initiatives</text>
  <text x="476" y="318" font-size="9" fill="#374151" font-weight="600">Categories:</text>
  <text x="476" y="334" font-size="9" fill="#6b7280">growth, enablement, go_to_market</text>
  <text x="476" y="348" font-size="9" fill="#6b7280">operational, investment</text>
  <text x="476" y="366" font-size="9" fill="#374151" font-weight="600">Tracking:</text>
  <text x="476" y="382" font-size="9" fill="#6b7280">Status: planned &#8594; in_progress &#8594; done</text>
  <text x="476" y="396" font-size="9" fill="#6b7280">Owner assignment (user_id)</text>
  <text x="476" y="410" font-size="9" fill="#6b7280">Target vs. actual dates</text>

  <!-- Assumptions -->
  <rect x="670" y="270" width="195" height="160" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="670" y="270" width="195" height="28" rx="8" fill="#7c3aed"/>
  <rect x="670" y="290" width="195" height="8" fill="#7c3aed"/>
  <text x="767" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Assumptions</text>
  <text x="686" y="318" font-size="9" fill="#374151" font-weight="600">Common Keys:</text>
  <text x="686" y="334" font-size="9" fill="#6b7280">conversion_rate, avg_deal_size</text>
  <text x="686" y="348" font-size="9" fill="#6b7280">avg_win_rate</text>
  <text x="686" y="366" font-size="9" fill="#374151" font-weight="600">Units:</text>
  <text x="686" y="382" font-size="9" fill="#6b7280">percentage, months, currency</text>
  <text x="686" y="396" font-size="9" fill="#6b7280">ratio, days</text>
  <text x="686" y="410" font-size="9" fill="#6b7280">planned_value vs. actual_value</text>

  <!-- Reviews -->
  <rect x="880" y="270" width="190" height="160" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="880" y="270" width="190" height="28" rx="8" fill="#dc2626"/>
  <rect x="880" y="290" width="190" height="8" fill="#dc2626"/>
  <text x="975" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Reviews</text>
  <text x="896" y="318" font-size="9" fill="#374151" font-weight="600">Review Types:</text>
  <text x="896" y="334" font-size="9" fill="#6b7280">monthly, quarterly, annual, ad_hoc</text>
  <text x="896" y="366" font-size="9" fill="#374151" font-weight="600">Content:</text>
  <text x="896" y="382" font-size="9" fill="#6b7280">Summary text</text>
  <text x="896" y="396" font-size="9" fill="#6b7280">Findings (JSON array)</text>
  <text x="896" y="410" font-size="9" fill="#6b7280">reviewed_by user, status</text>

  <!-- SCENARIO MODELING -->
  <rect x="40" y="450" width="1030" height="40" rx="8" fill="#7c3aed" opacity="0.08"/>
  <text x="550" y="476" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">SCENARIO MODELING &#38; WHAT-IF ANALYSIS</text>

  <!-- Scenario flow -->
  <rect x="40" y="505" width="240" height="90" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="505" width="240" height="28" rx="8" fill="#7c3aed"/>
  <rect x="40" y="525" width="240" height="8" fill="#7c3aed"/>
  <text x="160" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Base Plan (Committed)</text>
  <text x="56" y="552" font-size="9" fill="#374151">Locked targets, budgets, assumptions</text>
  <text x="56" y="568" font-size="9" fill="#374151">Serves as reference for comparison</text>
  <text x="56" y="584" font-size="9" fill="#6b7280">status: committed or active</text>

  <rect x="330" y="505" width="240" height="90" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="330" y="505" width="240" height="28" rx="8" fill="#9333ea"/>
  <rect x="330" y="525" width="240" height="8" fill="#9333ea"/>
  <text x="450" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Scenario (What-If)</text>
  <text x="346" y="552" font-size="9" fill="#374151">name, description, base_plan_id</text>
  <text x="346" y="568" font-size="9" fill="#374151">status: draft &#8594; finalized</text>
  <text x="346" y="584" font-size="9" fill="#6b7280">created_by user</text>

  <rect x="620" y="505" width="240" height="90" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="620" y="505" width="240" height="28" rx="8" fill="#a855f7"/>
  <rect x="620" y="525" width="240" height="8" fill="#a855f7"/>
  <text x="740" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Overrides</text>
  <text x="636" y="552" font-size="9" fill="#374151">override_type: target | assumption | budget</text>
  <text x="636" y="568" font-size="9" fill="#374151">original_value &#8594; override_value</text>
  <text x="636" y="584" font-size="9" fill="#6b7280">delta() and deltaPercentage() helpers</text>

  <rect x="910" y="505" width="160" height="90" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="910" y="505" width="160" height="28" rx="8" fill="#059669"/>
  <rect x="910" y="525" width="160" height="8" fill="#059669"/>
  <text x="990" y="525" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Compare</text>
  <text x="926" y="552" font-size="9" fill="#374151">Side-by-side scenarios</text>
  <text x="926" y="568" font-size="9" fill="#374151">Evaluate alternatives</text>
  <text x="926" y="584" font-size="9" fill="#6b7280">Feed into QBR</text>

  <!-- Scenario arrows -->
  <line x1="280" y1="550" x2="328" y2="550" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="570" y1="550" x2="618" y2="550" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrowPurple)"/>
  <line x1="860" y1="550" x2="908" y2="550" stroke="#374151" stroke-width="1.5" marker-end="url(#arrowDark)"/>

  <!-- ACTUALS COMPUTATION -->
  <rect x="40" y="615" width="1030" height="84" rx="8" fill="#fff" stroke="#e5e7eb" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="637" font-size="11" font-weight="700" fill="#374151">Automatic Actuals Computation (StrategyActualsService)</text>
  <text x="60" y="656" font-size="10" fill="#6b7280">Revenue: SUM(opportunities.amount WHERE stage=&#x27;Closed Won&#x27;) &#8226; Pipeline: SUM(open opportunities) &#8226; Win Rate: won / (won + lost) &#215; 100</text>
  <text x="60" y="672" font-size="10" fill="#6b7280">Tier Partners: COUNT by latest scorecard tier &#8226; Delivery: COUNT(completed projects), AVG(CSAT) &#8226; Enablement: from completion records</text>
  <text x="60" y="688" font-size="10" fill="#6b7280">Fiscal Year: Feb&#8211;Jan (Q1: Feb&#8211;Apr, Q2: May&#8211;Jul, Q3: Aug&#8211;Oct, Q4: Nov&#8211;Jan) &#8226; Actuals flow into quarterly breakdowns automatically</text>

  <!-- Footer -->
  <text x="550" y="714" text-anchor="middle" font-size="9" fill="#9ca3af">Strategy Module (CoE role) &#8212; Plans, Targets, Budgets, Initiatives, Assumptions, Reviews, Scenarios</text>
</svg>
