<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1100" height="820" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Signal Engine Pipeline</text>
  <text x="550" y="56" text-anchor="middle" font-size="11" fill="#6b7280">8 processors generate 73+ signals across 6 channels &#8212; scheduled daily (05:00) and weekly (Mon 07:00)</text>

  <!-- DATA SOURCES (left column) -->
  <text x="100" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">DATA SOURCES</text>

  <rect x="20" y="105" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="127" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Partner Alerts</text>

  <rect x="20" y="145" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="167" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Health Snapshots</text>

  <rect x="20" y="185" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="207" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Certifications</text>

  <rect x="20" y="225" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="247" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Opportunities</text>

  <rect x="20" y="265" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="287" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Enablement Events</text>

  <rect x="20" y="305" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="327" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Blueprints</text>

  <rect x="20" y="345" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="367" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Contact Interactions</text>

  <rect x="20" y="385" width="160" height="34" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="100" y="407" text-anchor="middle" font-size="10" font-weight="600" fill="#1e40af">Scorecards</text>

  <!-- PROCESSORS (center column) -->
  <text x="400" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">SIGNAL PROCESSORS</text>

  <!-- Daily processors -->
  <rect x="240" y="105" width="320" height="38" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="124" r="8" fill="#fecaca"/>
  <text x="262" y="128" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">R</text>
  <text x="280" y="120" font-size="10" font-weight="600" fill="#111827">AlertBridgeProcessor</text>
  <text x="280" y="134" font-size="9" fill="#6b7280">Maps alerts &#8594; signals | Conf: 0.70&#8211;0.95</text>

  <rect x="240" y="149" width="320" height="38" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="168" r="8" fill="#fed7aa"/>
  <text x="262" y="172" text-anchor="middle" font-size="8" font-weight="700" fill="#ea580c">T</text>
  <text x="280" y="164" font-size="10" font-weight="600" fill="#111827">HealthTrendProcessor</text>
  <text x="280" y="178" font-size="9" fill="#6b7280">7d/30d decline &#38; improvement | Conf: 0.60&#8211;0.95</text>

  <rect x="240" y="193" width="320" height="38" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="212" r="8" fill="#fecaca"/>
  <text x="262" y="216" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">R</text>
  <text x="280" y="208" font-size="10" font-weight="600" fill="#111827">DeliveryCapabilityProcessor</text>
  <text x="280" y="222" font-size="9" fill="#6b7280">Cert gaps vs. pipeline by product | Conf: 0.70&#8211;0.95</text>

  <rect x="240" y="237" width="320" height="38" rx="8" fill="#fff" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="256" r="8" fill="#fecaca"/>
  <text x="262" y="260" text-anchor="middle" font-size="8" font-weight="700" fill="#dc2626">R</text>
  <text x="280" y="252" font-size="10" font-weight="600" fill="#111827">PipelineVelocityProcessor</text>
  <text x="280" y="266" font-size="9" fill="#6b7280">Coverage, slipping deals, surges | Conf: 0.80&#8211;0.90</text>

  <rect x="240" y="281" width="320" height="38" rx="8" fill="#fff" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="300" r="8" fill="#fed7aa"/>
  <text x="262" y="304" text-anchor="middle" font-size="8" font-weight="700" fill="#ea580c">T</text>
  <text x="280" y="296" font-size="10" font-weight="600" fill="#111827">EnablementMomentumProcessor</text>
  <text x="280" y="310" font-size="9" fill="#6b7280">Blueprint, cert expiry, stalled | Conf: 0.75&#8211;0.90</text>

  <rect x="240" y="325" width="320" height="38" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="344" r="8" fill="#ede9fe"/>
  <text x="262" y="348" text-anchor="middle" font-size="8" font-weight="700" fill="#7c3aed">A</text>
  <text x="280" y="340" font-size="10" font-weight="600" fill="#111827">EngagementAnomalyProcessor</text>
  <text x="280" y="354" font-size="9" fill="#6b7280">Drops, spikes, dormancy (90d+) | Conf: 0.70&#8211;0.85</text>

  <rect x="240" y="369" width="320" height="38" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="388" r="8" fill="#d1fae5"/>
  <text x="262" y="392" text-anchor="middle" font-size="8" font-weight="700" fill="#059669">C</text>
  <text x="280" y="384" font-size="10" font-weight="600" fill="#111827">CrossDimensionCorrelationProcessor</text>
  <text x="280" y="398" font-size="9" fill="#6b7280">Compounding risk, escalation, momentum | Conf: 0.70&#8211;0.95</text>

  <!-- Weekly processor -->
  <rect x="240" y="420" width="320" height="38" rx="8" fill="#fff" stroke="#0891b2" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="260" cy="439" r="8" fill="#cffafe"/>
  <text x="262" y="443" text-anchor="middle" font-size="8" font-weight="700" fill="#0891b2">B</text>
  <text x="280" y="435" font-size="10" font-weight="600" fill="#111827">BenchmarkProcessor</text>
  <text x="280" y="449" font-size="9" fill="#6b7280">Portfolio avg comparison (weekly) | Conf: 0.75</text>

  <!-- Cadence labels -->
  <rect x="242" y="96" width="50" height="16" rx="3" fill="#059669"/>
  <text x="267" y="107" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">DAILY</text>

  <rect x="242" y="411" width="54" height="16" rx="3" fill="#0891b2"/>
  <text x="269" y="422" text-anchor="middle" font-size="8" font-weight="600" fill="#fff">WEEKLY</text>

  <!-- Arrows from data sources to processors -->
  <line x1="180" y1="122" x2="238" y2="122" stroke="#93c5fd" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <line x1="180" y1="162" x2="238" y2="167" stroke="#93c5fd" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <line x1="180" y1="202" x2="238" y2="212" stroke="#93c5fd" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <line x1="180" y1="242" x2="238" y2="255" stroke="#93c5fd" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <line x1="180" y1="282" x2="238" y2="300" stroke="#93c5fd" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <line x1="180" y1="322" x2="238" y2="300" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="180" y1="362" x2="238" y2="344" stroke="#93c5fd" stroke-width="1" marker-end="url(#arrowBlue)"/>
  <line x1="180" y1="402" x2="238" y2="388" stroke="#93c5fd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- SIGNAL CHANNELS (right area) -->
  <text x="750" y="90" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">SIGNAL CHANNELS</text>

  <rect x="620" y="105" width="140" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="690" y="126" text-anchor="middle" font-size="12" font-weight="700" fill="#dc2626">Risk</text>
  <text x="690" y="144" text-anchor="middle" font-size="9" fill="#6b7280">Critical, High, Warning</text>

  <rect x="620" y="163" width="140" height="50" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="690" y="184" text-anchor="middle" font-size="12" font-weight="700" fill="#ea580c">Trend</text>
  <text x="690" y="202" text-anchor="middle" font-size="9" fill="#6b7280">7d/30d patterns</text>

  <rect x="620" y="221" width="140" height="50" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="690" y="242" text-anchor="middle" font-size="12" font-weight="700" fill="#7c3aed">Anomaly</text>
  <text x="690" y="260" text-anchor="middle" font-size="9" fill="#6b7280">Unusual activity</text>

  <rect x="620" y="279" width="140" height="50" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="690" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#059669">Recommendation</text>
  <text x="690" y="318" text-anchor="middle" font-size="9" fill="#6b7280">Composite insights</text>

  <rect x="620" y="337" width="140" height="50" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="690" y="358" text-anchor="middle" font-size="12" font-weight="700" fill="#0891b2">Benchmark</text>
  <text x="690" y="376" text-anchor="middle" font-size="9" fill="#6b7280">Cohort comparison</text>

  <rect x="620" y="395" width="140" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="690" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#16a34a">Opportunity</text>
  <text x="690" y="434" text-anchor="middle" font-size="9" fill="#6b7280">Growth indicators</text>

  <!-- Arrows from processors to channels -->
  <line x1="560" y1="124" x2="618" y2="124" stroke="#dc2626" stroke-width="1.2" marker-end="url(#arrowBlue)"/>
  <line x1="560" y1="168" x2="618" y2="182" stroke="#ea580c" stroke-width="1.2"/>
  <line x1="560" y1="212" x2="618" y2="124" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="560" y1="256" x2="618" y2="130" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="560" y1="300" x2="618" y2="188" stroke="#ea580c" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="560" y1="344" x2="618" y2="246" stroke="#7c3aed" stroke-width="1.2"/>
  <line x1="560" y1="388" x2="618" y2="304" stroke="#059669" stroke-width="1.2"/>
  <line x1="560" y1="439" x2="618" y2="362" stroke="#0891b2" stroke-width="1.2"/>

  <!-- SEVERITY LEVELS -->
  <rect x="790" y="105" width="130" height="34" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1"/>
  <circle cx="810" cy="122" r="6" fill="#dc2626"/>
  <text x="825" y="126" font-size="10" font-weight="600" fill="#dc2626">Critical</text>

  <rect x="790" y="145" width="130" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1"/>
  <circle cx="810" cy="162" r="6" fill="#f97316"/>
  <text x="825" y="166" font-size="10" font-weight="600" fill="#f97316">Warning</text>

  <rect x="790" y="185" width="130" height="34" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="810" cy="202" r="6" fill="#3b82f6"/>
  <text x="825" y="206" font-size="10" font-weight="600" fill="#3b82f6">Info</text>

  <rect x="790" y="225" width="130" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <circle cx="810" cy="242" r="6" fill="#16a34a"/>
  <text x="825" y="246" font-size="10" font-weight="600" fill="#16a34a">Positive</text>

  <text x="855" y="96" text-anchor="middle" font-size="11" font-weight="600" fill="#374151">SEVERITY</text>

  <!-- SIGNAL OUTPUTS (bottom area) -->
  <rect x="20" y="480" width="1060" height="40" rx="8" fill="#7c3aed" opacity="0.08"/>
  <text x="550" y="506" text-anchor="middle" font-size="13" font-weight="700" fill="#7c3aed">SIGNAL OUTPUTS &#38; DESTINATIONS</text>

  <!-- Output boxes -->
  <rect x="20" y="540" width="200" height="110" rx="8" fill="#fff" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="20" y="540" width="200" height="28" rx="8" fill="#2563eb"/>
  <rect x="20" y="560" width="200" height="8" fill="#2563eb"/>
  <text x="120" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Partner Signal View</text>
  <text x="38" y="586" font-size="9" fill="#374151">&#8226; Active signals per partner</text>
  <text x="38" y="600" font-size="9" fill="#374151">&#8226; Channel breakdown cards</text>
  <text x="38" y="614" font-size="9" fill="#374151">&#8226; Acknowledge / Resolve actions</text>
  <text x="38" y="628" font-size="9" fill="#374151">&#8226; Recommended action text</text>
  <text x="38" y="642" font-size="9" fill="#374151">&#8226; Confidence scores</text>

  <rect x="240" y="540" width="200" height="110" rx="8" fill="#fff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="240" y="540" width="200" height="28" rx="8" fill="#059669"/>
  <rect x="240" y="560" width="200" height="8" fill="#059669"/>
  <text x="340" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Health Snapshot</text>
  <text x="258" y="586" font-size="9" fill="#374151">&#8226; Daily per-partner snapshot</text>
  <text x="258" y="600" font-size="9" fill="#374151">&#8226; Composite score (0&#8211;100)</text>
  <text x="258" y="614" font-size="9" fill="#374151">&#8226; 6 dimension scores</text>
  <text x="258" y="628" font-size="9" fill="#374151">&#8226; Risk level classification</text>
  <text x="258" y="642" font-size="9" fill="#374151">&#8226; Signal summary array</text>

  <rect x="460" y="540" width="200" height="110" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="460" y="540" width="200" height="28" rx="8" fill="#7c3aed"/>
  <rect x="460" y="560" width="200" height="8" fill="#7c3aed"/>
  <text x="560" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Signal Aggregate</text>
  <text x="478" y="586" font-size="9" fill="#374151">&#8226; Portfolio-level anonymized</text>
  <text x="478" y="600" font-size="9" fill="#374151">&#8226; Channel counts &#38; severity dist.</text>
  <text x="478" y="614" font-size="9" fill="#374151">&#8226; Health distribution</text>
  <text x="478" y="628" font-size="9" fill="#374151">&#8226; Dimension averages</text>
  <text x="478" y="642" font-size="9" fill="#374151">&#8226; Guarded by opt-in toggle</text>

  <rect x="680" y="540" width="180" height="110" rx="8" fill="#fff" stroke="#0891b2" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="680" y="540" width="180" height="28" rx="8" fill="#0891b2"/>
  <rect x="680" y="560" width="180" height="8" fill="#0891b2"/>
  <text x="770" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Control Plane</text>
  <text x="698" y="586" font-size="9" fill="#374151">&#8226; Cohort benchmarking</text>
  <text x="698" y="600" font-size="9" fill="#374151">&#8226; Fleet-wide analytics</text>
  <text x="698" y="614" font-size="9" fill="#374151">&#8226; Min 5 instances / cohort</text>
  <text x="698" y="628" font-size="9" fill="#374151">&#8226; p25 / median / p75 / mean</text>
  <text x="698" y="642" font-size="9" fill="#374151">&#8226; Returns via pm-agent</text>

  <rect x="880" y="540" width="200" height="110" rx="8" fill="#fff" stroke="#d97706" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="880" y="540" width="200" height="28" rx="8" fill="#d97706"/>
  <rect x="880" y="560" width="200" height="8" fill="#d97706"/>
  <text x="980" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#fff">Engine Run Log</text>
  <text x="898" y="586" font-size="9" fill="#374151">&#8226; signals_created count</text>
  <text x="898" y="600" font-size="9" fill="#374151">&#8226; signals_expired count</text>
  <text x="898" y="614" font-size="9" fill="#374151">&#8226; signals_correlated count</text>
  <text x="898" y="628" font-size="9" fill="#374151">&#8226; partners_processed count</text>
  <text x="898" y="642" font-size="9" fill="#374151">&#8226; duration_ms, status</text>

  <!-- Dedup note -->
  <rect x="20" y="670" width="1060" height="36" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="550" y="693" text-anchor="middle" font-size="10" fill="#854d0e">&#9888; Deduplication: Signals of the same type + partner within 24 hours are skipped. Stale signals (past expires_at) are auto-expired each run.</text>

  <!-- Execution flow note -->
  <rect x="20" y="720" width="1060" height="80" rx="8" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <text x="40" y="742" font-size="11" font-weight="600" fill="#374151">Execution Flow:</text>
  <text x="40" y="760" font-size="10" fill="#6b7280">1. SignalEngineService loads all partners in chunks of 50</text>
  <text x="40" y="776" font-size="10" fill="#6b7280">2. Each processor runs against every partner, generating signals with channel, severity, and confidence</text>
  <text x="40" y="792" font-size="10" fill="#6b7280">3. CrossDimensionCorrelationProcessor runs last &#8212; analyzes signals created by other processors to find compounding patterns</text>

  <!-- Footer -->
  <text x="550" y="815" text-anchor="middle" font-size="9" fill="#9ca3af">Partner Manager Signal Engine &#8212; artisan signal:process --cadence=daily|weekly</text>
</svg>
