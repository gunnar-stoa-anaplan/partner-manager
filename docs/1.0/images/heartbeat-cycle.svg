<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#636e72"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#636e72"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="560" rx="16" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3436">Heartbeat Cycle (every 30 seconds)</text>
  <text x="550" y="56" text-anchor="middle" font-size="11" fill="#636e72">Agent collects health data, posts to Control Plane, receives commands, and reports results</text>

  <!-- Actor headers -->
  <!-- Agent -->
  <rect x="160" y="78" width="180" height="38" rx="8" fill="#0984e3" filter="url(#shadow)"/>
  <text x="250" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Agent</text>

  <!-- Control Plane -->
  <rect x="760" y="78" width="180" height="38" rx="8" fill="#6c5ce7" filter="url(#shadow)"/>
  <text x="850" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Control Plane</text>

  <!-- Lifelines -->
  <line x1="250" y1="116" x2="250" y2="540" stroke="#b2bec3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="850" y1="116" x2="850" y2="540" stroke="#b2bec3" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Agent side preparation steps (1-3) -->
  <rect x="48" y="130" width="290" height="22" rx="4" fill="#fff" stroke="#0984e3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="58" y="146" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">1.</tspan> Collect container states from Docker API</text>

  <rect x="48" y="158" width="290" height="22" rx="4" fill="#fff" stroke="#0984e3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="58" y="174" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">2.</tspan> Check app container reachability</text>

  <rect x="48" y="186" width="290" height="22" rx="4" fill="#fff" stroke="#0984e3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="58" y="202" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">3.</tspan> Read system metrics (CPU, memory, disk)</text>

  <!-- Step 4: Agent -> CP: POST heartbeat -->
  <line x1="260" y1="232" x2="840" y2="232" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <rect x="355" y="216" width="390" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="550" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3436">POST /api/v1/agent/heartbeat (mTLS)</text>

  <!-- Payload note under arrow -->
  <text x="550" y="250" text-anchor="middle" font-size="9" font-style="italic" fill="#636e72">{ instance_id, health: { containers, reachable, cpu, memory, disk } }</text>

  <!-- CP side processing steps (4-7) -->
  <rect x="762" y="266" width="290" height="22" rx="4" fill="#fff" stroke="#6c5ce7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="772" y="282" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">4.</tspan> Validate client certificate fingerprint</text>

  <rect x="762" y="294" width="290" height="22" rx="4" fill="#fff" stroke="#6c5ce7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="772" y="310" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">5.</tspan> Store heartbeat in database</text>

  <rect x="762" y="322" width="290" height="22" rx="4" fill="#fff" stroke="#6c5ce7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="772" y="338" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">6.</tspan> Update instance status and last_seen</text>

  <rect x="762" y="350" width="290" height="22" rx="4" fill="#fff" stroke="#6c5ce7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="772" y="366" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">7.</tspan> Gather pending commands for this agent</text>

  <!-- Step 9: CP -> Agent: 200 response -->
  <line x1="840" y1="396" x2="260" y2="396" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrowLeft)"/>
  <rect x="400" y="380" width="300" height="22" rx="4" fill="#e6fcf5" stroke="#00b894" stroke-width="1"/>
  <text x="550" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="#00b894">200 { "commands": [...] }</text>

  <!-- Step 10: Agent side note (execute commands) -->
  <rect x="48" y="418" width="290" height="22" rx="4" fill="#fff" stroke="#0984e3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="58" y="434" font-size="10" font-style="italic" fill="#636e72"><tspan font-weight="600" fill="#2d3436">8.</tspan> Execute each command locally (deploy, relay, etc.)</text>

  <!-- Step 11: Agent -> CP: command report -->
  <line x1="260" y1="464" x2="840" y2="464" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <rect x="345" y="448" width="410" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="550" y="464" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3436">POST /api/v1/agent/commands/{id}/report</text>

  <!-- Payload note under arrow -->
  <text x="550" y="482" text-anchor="middle" font-size="9" font-style="italic" fill="#636e72">{ success: true, output: "deployed 2.2.0" }</text>

  <!-- Repeat indicator -->
  <rect x="410" y="502" width="280" height="22" rx="4" fill="#f8f9fa" stroke="#b2bec3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="550" y="518" text-anchor="middle" font-size="10" font-style="italic" fill="#b2bec3">cycle repeats every 30 seconds</text>

  <!-- Footer -->
  <text x="550" y="550" text-anchor="middle" font-size="9" fill="#b2bec3">Heartbeat interval configurable via AGENT_HEARTBEAT_INTERVAL_SECONDS (default 30)</text>
</svg>
