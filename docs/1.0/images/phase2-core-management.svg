    <rect x="508" y="462" width="185" height="44" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
    <text x="600" y="479" text-anchor="middle" font-weight="600" fill="#1e40af">Variance Tracking</text>
    <text x="600" y="497" text-anchor="middle" fill="#6b7280" font-size="9">Plan vs. actuals monitoring</text>
