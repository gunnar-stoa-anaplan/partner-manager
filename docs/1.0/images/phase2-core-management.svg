    <text x="110" y="248" text-anchor="middle" font-weight="600" fill="#166534">API Feeds</text>
    <text x="110" y="262" text-anchor="middle" fill="#6b7280" font-size="9">External integrations</text>

    <rect x="45" y="280" width="130" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="110" y="298" text-anchor="middle" font-weight="600" fill="#166534">Anaplan</text>
    <text x="110" y="312" text-anchor="middle" fill="#6b7280" font-size="9">Workspaces, versions</text>
