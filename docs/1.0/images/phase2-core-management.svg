  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Phase 2: Core Partner Management</text>
  <text x="480" y="58" text-anchor="middle" font-size="11" fill="#6b7280">Continuous data flows, automated processing, and real-time partner intelligence</text>

