    <text x="110" y="148" text-anchor="middle" font-weight="600" fill="#166534">Salesforce</text>
    <text x="110" y="162" text-anchor="middle" fill="#6b7280" font-size="9">Opps, Contacts, Accounts</text>

    <rect x="45" y="180" width="130" height="40" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="110" y="198" text-anchor="middle" font-weight="600" fill="#166534">CSV Imports</text>
    <text x="110" y="212" text-anchor="middle" fill="#6b7280" font-size="9">Bulk data uploads</text>

