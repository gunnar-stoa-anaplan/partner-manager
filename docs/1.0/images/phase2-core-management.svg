  <line x1="710" y1="320" x2="750" y2="320" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowSignal)"/>
  <line x1="710" y1="430" x2="750" y2="430" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arrowSignal)"/>

