    <rect x="765" y="218" width="150" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="840" y="239" text-anchor="middle" font-weight="600" fill="#991b1b">Alerts &#38; Actions</text>

    <rect x="765" y="258" width="150" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="840" y="279" text-anchor="middle" font-weight="600" fill="#991b1b">Portfolio Analytics</text>

    <rect x="765" y="298" width="150" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="840" y="319" text-anchor="middle" font-weight="600" fill="#991b1b">Revenue Analysis</text>

    <rect x="765" y="338" width="150" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="840" y="359" text-anchor="middle" font-weight="600" fill="#991b1b">QBR Workbench</text>

    <rect x="765" y="378" width="150" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="840" y="399" text-anchor="middle" font-weight="600" fill="#991b1b">Benchmarks</text>

    <rect x="765" y="418" width="150" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="840" y="439" text-anchor="middle" font-weight="600" fill="#991b1b">Partner Profiles</text>

    <rect x="765" y="458" width="150" height="32" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="840" y="479" text-anchor="middle" font-weight="600" fill="#991b1b">Delivery Metrics</text>
  </g>

  <!-- Control Plane output (bottom) -->
  <rect x="490" y="540" width="220" height="45" rx="8" fill="#f3e8ff" stroke="#a78bfa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="600" y="560" text-anchor="middle" font-size="11" font-weight="600" fill="#6b21a8">Control Plane</text>
  <text x="600" y="576" text-anchor="middle" font-size="9" fill="#7c3aed">Signal Network &#8226; Benchmarks &#8226; Telemetry</text>
  <line x1="600" y1="520" x2="600" y2="540" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowSignal)"/>

  <!-- Legend -->
