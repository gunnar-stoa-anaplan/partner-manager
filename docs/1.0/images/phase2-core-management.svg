  <line x1="120" y1="557" x2="155" y2="557" stroke="#059669" stroke-width="2" marker-end="url(#arrowIn)"/>
  <text x="160" y="561" font-size="9" fill="#6b7280">Ingest</text>
  <line x1="200" y1="557" x2="235" y2="557" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowOut)"/>
  <text x="240" y="561" font-size="9" fill="#6b7280">Process</text>
  <line x1="285" y1="557" x2="320" y2="557" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowSignal)"/>
  <text x="325" y="561" font-size="9" fill="#6b7280">Output</text>

  <!-- Footer -->
  <text x="480" y="620" text-anchor="middle" font-size="10" fill="#9ca3af">All processing runs on automated schedules. Signal Engine runs daily at 05:00 and weekly on Mondays at 07:00.</text>
