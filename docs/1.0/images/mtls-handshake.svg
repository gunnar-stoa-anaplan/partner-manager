<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowRight" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#636e72"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="7" refX="1" refY="3.5" orient="auto">
      <polygon points="10 0, 0 3.5, 10 7" fill="#636e72"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="480" rx="16" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#2d3436">mTLS (Mutual TLS) Handshake</text>
  <text x="550" y="56" text-anchor="middle" font-size="11" fill="#636e72">Both parties authenticate each other using X.509 certificates before establishing an encrypted channel</text>

  <!-- Actor headers -->
  <!-- Agent -->
  <rect x="160" y="78" width="180" height="38" rx="8" fill="#0984e3" filter="url(#shadow)"/>
  <text x="250" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Agent</text>

  <!-- Control Plane -->
  <rect x="760" y="78" width="180" height="38" rx="8" fill="#6c5ce7" filter="url(#shadow)"/>
  <text x="850" y="103" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">Control Plane</text>

  <!-- Lifelines -->
  <line x1="250" y1="116" x2="250" y2="460" stroke="#b2bec3" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="850" y1="116" x2="850" y2="460" stroke="#b2bec3" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Step 1: Agent -> CP: TLS ClientHello -->
  <line x1="260" y1="148" x2="840" y2="148" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <rect x="410" y="132" width="280" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="550" y="148" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3436">1. TLS ClientHello (TLS 1.3)</text>

  <!-- Step 2: CP -> Agent: ServerHello + certs -->
  <line x1="840" y1="190" x2="260" y2="190" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrowLeft)"/>
  <rect x="340" y="174" width="420" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="550" y="190" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3436">2. ServerHello + Server Cert + CertificateRequest</text>

  <!-- Step 3: Agent side note (verification) -->
  <rect x="48" y="218" width="280" height="58" rx="6" fill="#fff" stroke="#0984e3" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="58" y="236" font-size="10" font-style="italic" fill="#636e72">Agent verifies:</text>
  <text x="58" y="252" font-size="10" fill="#636e72">&#x2713; Server cert signed by trusted CA?</text>
  <text x="58" y="268" font-size="10" fill="#636e72">&#x2713; Not expired? Hostname matches?</text>

  <!-- Step 4: Agent -> CP: Client Certificate -->
  <line x1="260" y1="300" x2="840" y2="300" stroke="#636e72" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <rect x="380" y="284" width="340" height="22" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="550" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#2d3436">3. Client Certificate (signed by CA)</text>

  <!-- Step 5: CP side note (verification) -->
  <rect x="772" y="320" width="290" height="72" rx="6" fill="#fff" stroke="#6c5ce7" stroke-width="1" stroke-dasharray="4,2"/>
  <text x="782" y="338" font-size="10" font-style="italic" fill="#636e72">Control Plane verifies:</text>
  <text x="782" y="354" font-size="10" fill="#636e72">&#x2713; Client cert signed by trusted CA?</text>
  <text x="782" y="370" font-size="10" fill="#636e72">&#x2713; Not expired or revoked?</text>
  <text x="782" y="386" font-size="10" fill="#636e72">&#x2713; Fingerprint matches registered instance?</text>

  <!-- Step 6: CP -> Agent: Encrypted channel established -->
  <line x1="840" y1="420" x2="260" y2="420" stroke="#00b894" stroke-width="2" marker-end="url(#arrowLeft)"/>
  <rect x="385" y="404" width="330" height="22" rx="4" fill="#e6fcf5" stroke="#00b894" stroke-width="1"/>
  <text x="550" y="420" text-anchor="middle" font-size="11" font-weight="700" fill="#00b894">4. Encrypted channel established</text>

  <!-- Lock icon hint -->
  <text x="550" y="450" text-anchor="middle" font-size="10" fill="#636e72">All subsequent traffic is encrypted and mutually authenticated</text>
</svg>
