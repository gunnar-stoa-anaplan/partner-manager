<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1000" height="780" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Health Score Composition</text>
  <text x="500" y="56" text-anchor="middle" font-size="11" fill="#6b7280">Weighted composite of 6 dimensions &#8212; scored 0&#8211;100, classified into risk levels, snapshotted daily</text>

  <!-- DIMENSION CARDS -->
  <!-- Row 1 -->
  <rect x="30" y="80" width="300" height="140" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="80" width="300" height="30" rx="8" fill="#2563eb"/>
  <rect x="30" y="102" width="300" height="8" fill="#2563eb"/>
  <text x="180" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Scorecard &#8212; 25%</text>
  <text x="48" y="130" font-size="10" fill="#374151">Latest PartnerScorecard.overall_score</text>
  <text x="48" y="148" font-size="10" fill="#374151">6 sub-dimensions: certification, pipeline,</text>
  <text x="48" y="164" font-size="10" fill="#374151">delivery, engagement, growth, self-sufficiency</text>
  <text x="48" y="182" font-size="10" fill="#374151">Default: 50 if no scorecard exists</text>
  <text x="48" y="200" font-size="10" fill="#6b7280">Data: partner_scorecards table</text>
  <rect x="270" y="88" width="50" height="18" rx="4" fill="#dbeafe"/>
  <text x="295" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#1e40af">0.25</text>

  <rect x="350" y="80" width="300" height="140" rx="8" fill="#fff" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <rect x="350" y="80" width="300" height="30" rx="8" fill="#059669"/>
  <rect x="350" y="102" width="300" height="8" fill="#059669"/>
  <text x="500" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Pipeline Trend &#8212; 20%</text>
  <text x="368" y="130" font-size="10" fill="#374151">Current open pipeline vs. 90&#8211;120d baseline</text>
  <text x="368" y="148" font-size="10" fill="#374151">&#8805;20% growth: 100 | 0&#8211;20%: 75</text>
  <text x="368" y="164" font-size="10" fill="#374151">-20%&#8211;0%: 50 | -40%&#8211;-20%: 25 | &lt;-40%: 0</text>
  <text x="368" y="182" font-size="10" fill="#374151">Default: 70 (pipeline, no history) or 40</text>
  <text x="368" y="200" font-size="10" fill="#6b7280">Data: opportunities table</text>
  <rect x="590" y="88" width="50" height="18" rx="4" fill="#d1fae5"/>
  <text x="615" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">0.20</text>

  <rect x="670" y="80" width="300" height="140" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <rect x="670" y="80" width="300" height="30" rx="8" fill="#7c3aed"/>
  <rect x="670" y="102" width="300" height="8" fill="#7c3aed"/>
  <text x="820" y="101" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Goal Attainment &#8212; 20%</text>
  <text x="688" y="130" font-size="10" fill="#374151">Average % of current FY goals met</text>
  <text x="688" y="148" font-size="10" fill="#374151">Across all PartnerAssignedGoal records</text>
  <text x="688" y="164" font-size="10" fill="#374151">Capped at 100, defaults to 50</text>
  <text x="688" y="182" font-size="10" fill="#374151">Fiscal year starts February</text>
  <text x="688" y="200" font-size="10" fill="#6b7280">Data: partner_assigned_goals table</text>
  <rect x="910" y="88" width="50" height="18" rx="4" fill="#ede9fe"/>
  <text x="935" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#6b21a8">0.20</text>

  <!-- Row 2 -->
  <rect x="30" y="236" width="300" height="150" rx="8" fill="#fff" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <rect x="30" y="236" width="300" height="30" rx="8" fill="#d97706"/>
  <rect x="30" y="258" width="300" height="8" fill="#d97706"/>
  <text x="180" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Enablement &#8212; 15%</text>
  <text x="48" y="286" font-size="10" fill="#374151">Weighted sub-composite:</text>
  <text x="48" y="304" font-size="10" fill="#374151">&#8226; 40% Events (last 90d, target 6+)</text>
  <text x="48" y="320" font-size="10" fill="#374151">&#8226; 30% Attendance rate (target 80%)</text>
  <text x="48" y="336" font-size="10" fill="#374151">&#8226; 30% Blueprint completion rate</text>
  <text x="48" y="356" font-size="10" fill="#6b7280">Data: events, registrations, blueprints</text>
  <rect x="270" y="244" width="50" height="18" rx="4" fill="#fef3c7"/>
  <text x="295" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">0.15</text>

  <rect x="350" y="236" width="300" height="150" rx="8" fill="#fff" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <rect x="350" y="236" width="300" height="30" rx="8" fill="#dc2626"/>
  <rect x="350" y="258" width="300" height="8" fill="#dc2626"/>
  <text x="500" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Contact Freshness &#8212; 10%</text>
  <text x="368" y="286" font-size="10" fill="#374151">Days since last interaction/update:</text>
  <text x="368" y="304" font-size="10" fill="#374151">&#8804;14d: 100 | &#8804;30d: 80 | &#8804;60d: 60</text>
  <text x="368" y="320" font-size="10" fill="#374151">&#8804;90d: 40 | &#8804;180d: 20 | &gt;180d: 0</text>
  <text x="368" y="340" font-size="10" fill="#374151">Prioritizes ContactInteraction over updated_at</text>
  <text x="368" y="358" font-size="10" fill="#6b7280">Data: contact_interactions, contacts</text>
  <rect x="590" y="244" width="50" height="18" rx="4" fill="#fecaca"/>
  <text x="615" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#dc2626">0.10</text>

  <rect x="670" y="236" width="300" height="150" rx="8" fill="#fff" stroke="#0891b2" stroke-width="2" filter="url(#shadow)"/>
  <rect x="670" y="236" width="300" height="30" rx="8" fill="#0891b2"/>
  <rect x="670" y="258" width="300" height="8" fill="#0891b2"/>
  <text x="820" y="257" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Delivery CSAT &#8212; 10%</text>
  <text x="688" y="286" font-size="10" fill="#374151">Average customer_satisfaction (1&#8211;5)</text>
  <text x="688" y="304" font-size="10" fill="#374151">from completed projects</text>
  <text x="688" y="320" font-size="10" fill="#374151">Formula: ((avg &#8211; 1) / 4) &#215; 100</text>
  <text x="688" y="340" font-size="10" fill="#374151">Default: 50 if no completed projects</text>
  <text x="688" y="358" font-size="10" fill="#6b7280">Data: projects table (completed)</text>
  <rect x="910" y="244" width="50" height="18" rx="4" fill="#cffafe"/>
  <text x="935" y="256" text-anchor="middle" font-size="10" font-weight="700" fill="#0e7490">0.10</text>

  <!-- FORMULA -->
  <rect x="30" y="410" width="940" height="50" rx="8" fill="#111827"/>
  <text x="500" y="432" text-anchor="middle" font-size="12" font-weight="600" fill="#e5e7eb" font-style="italic">
    Health Score = (Scorecard &#215; 0.25) + (Pipeline &#215; 0.20) + (Goals &#215; 0.20) + (Enablement &#215; 0.15) + (Contact &#215; 0.10) + (CSAT &#215; 0.10)
  </text>
  <text x="500" y="450" text-anchor="middle" font-size="10" fill="#9ca3af">Result: composite score 0&#8211;100, stored as decimal(5,1) in partner_health_snapshots</text>

  <!-- RISK LEVEL THRESHOLDS -->
  <text x="500" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Risk Level Classification</text>

  <!-- Threshold bar -->
  <rect x="80" y="515" width="840" height="60" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>

  <!-- Critical zone -->
  <rect x="80" y="515" width="210" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="185" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Critical</text>
  <text x="185" y="560" text-anchor="middle" font-size="11" fill="#991b1b">0 &#8211; 29</text>

  <!-- At Risk zone -->
  <rect x="290" y="515" width="210" height="60" rx="0" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
  <text x="395" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#ea580c">At Risk</text>
  <text x="395" y="560" text-anchor="middle" font-size="11" fill="#c2410c">30 &#8211; 49</text>

  <!-- Watch zone -->
  <rect x="500" y="515" width="210" height="60" rx="0" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="605" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#2563eb">Watch</text>
  <text x="605" y="560" text-anchor="middle" font-size="11" fill="#1e40af">50 &#8211; 69</text>

  <!-- Healthy zone -->
  <rect x="710" y="515" width="210" height="60" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="815" y="542" text-anchor="middle" font-size="14" font-weight="700" fill="#059669">Healthy</text>
  <text x="815" y="560" text-anchor="middle" font-size="11" fill="#166534">70 &#8211; 100</text>

  <!-- Threshold markers -->
  <line x1="290" y1="508" x2="290" y2="582" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="290" y="598" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">30</text>
  <line x1="500" y1="508" x2="500" y2="582" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="500" y="598" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">50</text>
  <line x1="710" y1="508" x2="710" y2="582" stroke="#374151" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="710" y="598" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">70</text>

  <!-- AUTOMATIC SIGNALS -->
  <text x="500" y="636" text-anchor="middle" font-size="14" font-weight="700" fill="#374151">Auto-Generated Warning Signals</text>
  <text x="500" y="654" text-anchor="middle" font-size="10" fill="#6b7280">Triggered when individual dimensions fall below threshold (&#8804;25&#8211;30 points)</text>

  <g font-size="10" fill="#374151">
    <rect x="30" y="668" width="180" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="120" y="687" text-anchor="middle" font-weight="600" fill="#dc2626">Pipeline Declined</text>

    <rect x="220" y="668" width="180" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="310" y="687" text-anchor="middle" font-weight="600" fill="#dc2626">Goal Gap (&lt;30%)</text>

    <rect x="410" y="668" width="180" height="28" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="500" y="687" text-anchor="middle" font-weight="600" fill="#ea580c">No Interactions 90d+</text>

    <rect x="600" y="668" width="180" height="28" rx="4" fill="#fff7ed" stroke="#fed7aa" stroke-width="1"/>
    <text x="690" y="687" text-anchor="middle" font-weight="600" fill="#ea580c">Enablement Stalled</text>

    <rect x="790" y="668" width="180" height="28" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="880" y="687" text-anchor="middle" font-weight="600" fill="#dc2626">Low CSAT / Scorecard</text>
  </g>

  <!-- Additional signals row -->
  <g font-size="10" fill="#374151">
    <rect x="30" y="704" width="220" height="28" rx="4" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
    <text x="140" y="723" text-anchor="middle" font-weight="600" fill="#92400e">&#8805;3 Stale Deals (45d+)</text>

    <rect x="260" y="704" width="220" height="28" rx="4" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
    <text x="370" y="723" text-anchor="middle" font-weight="600" fill="#92400e">&#8805;2 Certs Expiring (60d)</text>

    <rect x="490" y="704" width="220" height="28" rx="4" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
    <text x="600" y="723" text-anchor="middle" font-weight="600" fill="#92400e">Launch Program Risk</text>

    <rect x="720" y="704" width="250" height="28" rx="4" fill="#fefce8" stroke="#fde68a" stroke-width="1"/>
    <text x="845" y="723" text-anchor="middle" font-weight="600" fill="#92400e">Path Stage Stalled (90d+)</text>
  </g>

  <!-- Footer -->
  <text x="500" y="770" text-anchor="middle" font-size="9" fill="#9ca3af">PartnerHealthService &#8212; computed daily, stored in partner_health_snapshots with dimensions JSON</text>
</svg>
