<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="adminGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e2f"/>
      <stop offset="100%" stop-color="#2d2d44"/>
    </linearGradient>
    <linearGradient id="coeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="100%" stop-color="#a29bfe"/>
    </linearGradient>
    <linearGradient id="psmGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0984e3"/>
      <stop offset="100%" stop-color="#74b9ff"/>
    </linearGradient>
    <linearGradient id="partnerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00b894"/>
      <stop offset="100%" stop-color="#55efc4"/>
    </linearGradient>
    <marker id="arrowRight" markerWidth="12" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L12,4 L0,8 Z" fill="#636e72"/>
    </marker>
    <marker id="arrowLeft" markerWidth="12" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M12,0 L0,4 L12,8 Z" fill="#636e72"/>
    </marker>
    <marker id="arrowUp" markerWidth="8" markerHeight="12" refX="4" refY="2" orient="auto">
      <path d="M0,12 L4,0 L8,12 Z" fill="#b2bec3"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" rx="16" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="550" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#2d3436">Partner Manager Platform &#8212; Role Relationship &amp; Data Flow</text>
  <line x1="350" y1="54" x2="750" y2="54" stroke="#dfe6e9" stroke-width="1.5"/>

  <!-- ════════════ ADMIN BOX ════════════ -->
  <rect x="370" y="72" width="360" height="72" rx="12" fill="url(#adminGrad)" filter="url(#shadow)"/>
  <text x="550" y="102" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">Admin</text>
  <text x="550" y="122" text-anchor="middle" font-size="11" fill="#b2bec3">System owner &#8226; Full access to all modules &amp; configuration</text>

  <!-- Admin → CoE arrow -->
  <line x1="460" y1="144" x2="280" y2="200" stroke="#636e72" stroke-width="1.8" marker-end="url(#arrowRight)"/>
  <text x="340" y="168" text-anchor="middle" font-size="10" fill="#636e72" font-style="italic">manages</text>

  <!-- Admin → PSM arrow -->
  <line x1="640" y1="144" x2="810" y2="200" stroke="#636e72" stroke-width="1.8" marker-end="url(#arrowRight)"/>
  <text x="755" y="168" text-anchor="middle" font-size="10" fill="#636e72" font-style="italic">manages</text>

  <!-- ════════════ COE BOX ════════════ -->
  <rect x="60" y="200" width="420" height="210" rx="14" fill="#fff" stroke="#6c5ce7" stroke-width="2" filter="url(#shadow)"/>
  <!-- COE header -->
  <rect x="60" y="200" width="420" height="46" rx="14" fill="url(#coeGrad)"/>
  <rect x="60" y="226" width="420" height="20" fill="url(#coeGrad)"/>
  <text x="280" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">CoE &#8212; Center of Excellence</text>
  <!-- COE bullets -->
  <text x="82" y="272" font-size="12" fill="#2d3436" font-weight="600">Strategy Workbench</text>
  <text x="82" y="294" font-size="11" fill="#636e72">&#8226; Strategic Plans &amp; versioning</text>
  <text x="82" y="312" font-size="11" fill="#636e72">&#8226; Scenario modeling &amp; comparison</text>
  <text x="82" y="330" font-size="11" fill="#636e72">&#8226; Budget allocation &amp; targets</text>
  <text x="82" y="348" font-size="11" fill="#636e72">&#8226; Initiative governance</text>
  <text x="82" y="366" font-size="11" fill="#636e72">&#8226; Variance analysis &amp; reviews</text>
  <!-- COE focus label -->
  <rect x="310" y="270" width="152" height="56" rx="8" fill="#f0edff"/>
  <text x="386" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#6c5ce7">FOCUS</text>
  <text x="386" y="306" text-anchor="middle" font-size="10" fill="#6c5ce7">Program design &amp;</text>
  <text x="386" y="320" text-anchor="middle" font-size="10" fill="#6c5ce7">strategic direction</text>

  <!-- ════════════ PSM BOX ════════════ -->
  <rect x="620" y="200" width="420" height="210" rx="14" fill="#fff" stroke="#0984e3" stroke-width="2" filter="url(#shadow)"/>
  <!-- PSM header -->
  <rect x="620" y="200" width="420" height="46" rx="14" fill="url(#psmGrad)"/>
  <rect x="620" y="226" width="420" height="20" fill="url(#psmGrad)"/>
  <text x="830" y="230" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">PSM &#8212; Partner Success Manager</text>
  <!-- PSM bullets -->
  <text x="642" y="272" font-size="11" fill="#636e72">&#8226; Partner dashboard &amp; profiles</text>
  <text x="642" y="290" font-size="11" fill="#636e72">&#8226; Scorecard, goals &amp; task boards</text>
  <text x="642" y="308" font-size="11" fill="#636e72">&#8226; Field engagements &amp; enablement</text>
  <text x="642" y="326" font-size="11" fill="#636e72">&#8226; Deal registration &amp; pipeline</text>
  <text x="642" y="344" font-size="11" fill="#636e72">&#8226; Health monitoring &amp; alerts</text>
  <text x="642" y="362" font-size="11" fill="#636e72">&#8226; QBR prep &amp; analytics</text>
  <!-- PSM focus label -->
  <rect x="870" y="270" width="152" height="56" rx="8" fill="#e8f4fd"/>
  <text x="946" y="290" text-anchor="middle" font-size="10" font-weight="600" fill="#0984e3">FOCUS</text>
  <text x="946" y="306" text-anchor="middle" font-size="10" fill="#0984e3">Day-to-day partner</text>
  <text x="946" y="320" text-anchor="middle" font-size="10" fill="#0984e3">execution &amp; growth</text>

  <!-- ════════════ CoE → PSM flow arrow ════════════ -->
  <line x1="480" y1="305" x2="620" y2="305" stroke="#636e72" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arrowRight)"/>
  <rect x="496" y="280" width="108" height="18" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="550" y="293" text-anchor="middle" font-size="9.5" font-weight="600" fill="#636e72">Targets &amp; Plans</text>

  <!-- ════════════ PARTNER BOX ════════════ -->
  <rect x="370" y="490" width="360" height="180" rx="14" fill="#fff" stroke="#00b894" stroke-width="2" filter="url(#shadow)"/>
  <!-- Partner header -->
  <rect x="370" y="490" width="360" height="46" rx="14" fill="url(#partnerGrad)"/>
  <rect x="370" y="516" width="360" height="20" fill="url(#partnerGrad)"/>
  <text x="550" y="520" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Partner</text>
  <!-- Partner bullets -->
  <text x="392" y="558" font-size="11" fill="#636e72">&#8226; Self-service portal</text>
  <text x="392" y="576" font-size="11" fill="#636e72">&#8226; Blueprint enrollment &amp; progress</text>
  <text x="392" y="594" font-size="11" fill="#636e72">&#8226; Goal tracking &amp; path advancement</text>
  <text x="392" y="612" font-size="11" fill="#636e72">&#8226; Deal registrations &amp; projects</text>
  <text x="392" y="630" font-size="11" fill="#636e72">&#8226; Launch programs &amp; workshops</text>
  <text x="392" y="648" font-size="11" fill="#636e72">&#8226; Certifications &amp; calendar</text>

  <!-- PSM → Partner arrow -->
  <line x1="830" y1="410" x2="680" y2="490" stroke="#636e72" stroke-width="2.2" marker-end="url(#arrowRight)"/>
  <rect x="752" y="436" width="100" height="18" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="802" y="449" text-anchor="middle" font-size="9.5" font-weight="600" fill="#636e72">Engages with</text>

  <!-- Partner → PSM feedback arrow -->
  <line x1="730" y1="530" x2="890" y2="410" stroke="#b2bec3" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRight)"/>
  <rect x="810" y="470" width="110" height="18" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="865" y="483" text-anchor="middle" font-size="9.5" fill="#b2bec3">Data &amp; feedback</text>

  <!-- PSM → CoE feedback arrow (measures) -->
  <line x1="620" y1="395" x2="480" y2="395" stroke="#b2bec3" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowRight)"/>
  <rect x="498" y="383" width="74" height="16" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="535" y="394" text-anchor="middle" font-size="9" fill="#b2bec3">Measures</text>

  <!-- CoE ← Partner indirect line (via measures) -->
  <line x1="270" y1="410" x2="420" y2="490" stroke="#b2bec3" stroke-width="1.2" stroke-dasharray="3,5" marker-end="url(#arrowRight)"/>
  <rect x="290" y="448" width="98" height="16" rx="4" fill="#fff" stroke="#dfe6e9" stroke-width="1"/>
  <text x="339" y="459" text-anchor="middle" font-size="9" fill="#b2bec3">Aggregated data</text>

  <!-- Legend -->
  <rect x="60" y="660" width="380" height="44" rx="8" fill="#f1f2f6"/>
  <line x1="80" y1="682" x2="120" y2="682" stroke="#636e72" stroke-width="2"/>
  <text x="128" y="686" font-size="10" fill="#636e72">Direct relationship</text>
  <line x1="240" y1="682" x2="280" y2="682" stroke="#b2bec3" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="288" y="686" font-size="10" fill="#b2bec3">Feedback / data flow</text>
</svg>
